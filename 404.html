<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Signal Lost | HEX.COACH</title>
  <meta name="robots" content="noindex, follow">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      background: #08080e;
      color: #e2e8f0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .card {
      width: 100%;
      max-width: 520px;
      background: linear-gradient(145deg, #14142a, #0f0f1e);
      border: 1px solid #2a2a4a;
      border-radius: 16px;
      padding: 36px 30px 30px;
      text-align: center;
    }
    .code {
      font-family: 'JetBrains Mono', 'Courier New', monospace;
      font-size: 13px;
      letter-spacing: 0.32em;
      color: #6366f1;
      text-transform: uppercase;
      margin-bottom: 14px;
    }
    h1 {
      font-size: 26px;
      font-weight: 800;
      line-height: 1.35;
      margin: 0 0 12px;
      background: linear-gradient(135deg, #a78bfa, #6366f1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    p {
      font-size: 15px;
      line-height: 1.7;
      color: #94a3b8;
      margin: 0 0 24px;
    }
    a.btn {
      display: inline-block;
      padding: 12px 30px;
      border-radius: 999px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #fff;
      font-family: 'JetBrains Mono', 'Courier New', monospace;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      letter-spacing: 0.04em;
    }
    a.btn:hover { opacity: 0.9; }
    .hint {
      margin-top: 22px;
      font-size: 12px;
      color: #475569;
      line-height: 1.7;
    }
    .hint a { color: #818cf8; text-decoration: none; }
    .hint a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main class="card">
    <div class="code">404 · SIGNAL LOST</div>
    <h1>This node is not in the arena.</h1>
    <p>
      The URL you requested does not exist on hex.coach. It may have been moved,
      renamed, or never shipped in the first place.
    </p>
    <a class="btn" href="/">RETURN TO THE ARENA</a>
    <div class="hint">
      Looking for something specific? Start from the
      <a href="/">6D Cognitive Arena home page</a> or read the
      <a href="/privacy.html">privacy policy</a>.
    </div>
  </main>
</body>
</html>
