<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>hex.coach — 6D Cognitive Arena</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: 'Inter', sans-serif;
      background: #08080e;
      color: #e2e8f0;
      display: flex;
      flex-direction: column;
    }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #2a2a4a; border-radius: 2px; }

    /* ─── Header ─────────────────────────────── */
    #header {
      flex-shrink: 0;
      padding: 0.7rem 1rem;
      background: rgba(10,10,18,0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid #1e1e3a;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      z-index: 20;
    }
    .header-logo {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 800;
      font-size: 1.1rem;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .header-progress {
      font-size: 0.7rem;
      color: #475569;
      margin-left: auto;
    }

    /* ─── Result header row (hidden by default) ─── */
    #resultHeaderRow {
      display: none;
      flex-shrink: 0;
      padding: 0.5rem 1rem;
      background: rgba(10,10,18,0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid #1e1e3a;
      align-items: center;
      gap: 0.6rem;
      z-index: 20;
    }
    #resultHeaderRow .power {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.88rem;
      font-weight: 700;
      color: #a78bfa;
      white-space: nowrap;
    }
    #resultHeaderRow .badge-wrap {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    #resultHeaderRow .medal {
      font-size: 1.2rem;
    }
    #resultHeaderRow .rank-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.88rem;
      font-weight: 700;
      background: linear-gradient(135deg, #a855f7, #f97316);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      white-space: nowrap;
    }

    /* ─── Chat container ─────────────────────── */
    #chatContainer {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 0.75rem 0.75rem 0.5rem;
      scroll-behavior: smooth;
    }
    #chatInner {
      max-width: 640px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    /* ─── Bubbles ────────────────────────────── */
    .bubble {
      max-width: 88%;
      border-radius: 1rem;
      padding: 0.7rem 0.9rem;
      font-size: 0.88rem;
      line-height: 1.55;
      animation: fadeUp 0.3s ease;
      word-break: break-word;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .bubble-ai {
      align-self: flex-start;
      background: linear-gradient(145deg, #1a1a2e, #16162a);
      border: 1px solid #2a2a4a;
      color: #e2e8f0;
      border-bottom-left-radius: 0.25rem;
    }
    .bubble-ai .author {
      font-size: 0.65rem;
      color: #6366f1;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.3rem;
      margin-bottom: 0.3rem;
    }
    .bubble-ai .author .avatar {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 20px; height: 20px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-radius: 50%;
      font-size: 0.6rem;
      color: #fff;
    }

    .bubble-user {
      align-self: flex-end;
      background: linear-gradient(135deg, #4f46e5, #6366f1);
      color: #fff;
      border-bottom-right-radius: 0.25rem;
    }

    /* ─── Inline option buttons ──────────────── */
    .option-group {
      align-self: flex-end;
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      justify-content: flex-end;
      max-width: 88%;
      animation: fadeUp 0.3s ease;
    }
    .opt-btn {
      flex: 0 0 auto;
      padding: 0.7rem 1rem;
      background: rgba(30,30,60,0.7);
      border: 1px solid #2e2e52;
      border-radius: 999px;
      color: #cbd5e1;
      font-size: 0.88rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      -webkit-tap-highlight-color: transparent;
      white-space: nowrap;
    }
    .opt-btn:active {
      animation: btnElastic 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes btnElastic {
      0%   { transform: scale(1); }
      25%  { transform: scale(0.93); }
      50%  { transform: scale(1.06); }
      75%  { transform: scale(0.97); }
      100% { transform: scale(1); }
    }
    .opt-btn:hover:not(.disabled) {
      background: rgba(99,102,241,0.15);
      border-color: #6366f1;
      color: #e2e8f0;
    }
    .opt-btn.correct {
      background: rgba(34,197,94,0.18);
      border-color: #22c55e;
      color: #86efac;
    }
    .opt-btn.wrong {
      background: rgba(239,68,68,0.18);
      border-color: #ef4444;
      color: #fca5a5;
    }
    .opt-btn.disabled { cursor: default; opacity: 0.6; }

    /* ─── GO! inline ─────────────────────────── */
    .go-inline {
      align-self: flex-end;
      padding: 0.7rem 2.2rem;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border: none;
      border-radius: 999px;
      color: #fff;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s;
      -webkit-tap-highlight-color: transparent;
    }
    .go-inline:active { transform: scale(0.94); }
    .go-inline.disabled { opacity: 0.4; cursor: default; transform: none; }

    /* ─── Fixed bottom timer bar ─────────────── */
    #bottomTimer {
      flex-shrink: 0;
      height: 3px;
      background: #1e1e3a;
      z-index: 30;
    }
    #timerFill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #6366f1, #a855f7);
      transition: width 0.1s linear;
    }
    #timerFill.warning { background: linear-gradient(90deg, #f59e0b, #ef4444); }

    /* ─── Typing dots ────────────────────────── */
    .typing-dots {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.3rem 0.1rem;
    }
    .typing-dots span {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #6366f1;
      animation: dotPulse 1.2s infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes dotPulse {
      0%,60%,100% { opacity: 0.3; transform: scale(1); }
      30% { opacity: 1; transform: scale(1.3); }
    }

    /* ─── Result card ────────────────────────── */
    .result-card {
      background: linear-gradient(145deg, #13131f, #1a1a2e);
      border: 1px solid #2a2a4a;
      border-radius: 1rem;
      padding: 1.2rem;
      margin-top: 0.3rem;
    }
    .rank-display {
      font-family: 'JetBrains Mono', monospace;
      font-size: 2rem;
      font-weight: 800;
      text-align: center;
      background: linear-gradient(135deg, #a855f7, #f97316);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.3;
    }
    .rank-sub {
      text-align: center;
      font-size: 0.75rem;
      color: #64748b;
      margin-bottom: 0.4rem;
    }
    .title-display {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      font-weight: 600;
      text-align: center;
      color: #c4b5fd;
      margin-bottom: 0.3rem;
      line-height: 1.4;
    }
    .restart-btn {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      width: 100%;
      padding: 0.75rem;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border: none;
      border-radius: 0.7rem;
      color: #fff;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s;
    }
    .restart-btn:active { transform: scale(0.97); }

    /* ─── Scroll Snap Card Container ─────────── */
    .snap-scroll {
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      width: 100%;
      padding: 0.5rem 0;
    }
    .snap-scroll::-webkit-scrollbar { display: none; }
    .snap-scroll { -ms-overflow-style: none; scrollbar-width: none; }
    .snap-card {
      width: 100%;
      flex-shrink: 0;
      scroll-snap-align: center;
      padding: 0 0.25rem;
    }
    .snap-card-inner {
      background: rgba(30,30,60,0.6);
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 0.75rem;
      padding: 1rem 1rem;
    }
    .snap-card-header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }
    .snap-card-header .dim-emoji { font-size: 1.2rem; }
    .snap-card-header .dim-name {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: 0.9rem;
      color: #c4b5fd;
    }
    .snap-card-header .dim-score {
      margin-left: auto;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      color: #64748b;
    }
    .snap-card-text {
      font-size: 0.82rem;
      line-height: 1.65;
      color: #94a3b8;
    }

    /* ─── Dot indicators ─────────────────────── */
    .dots-wrap {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      margin-top: 0.4rem;
      margin-bottom: 0.6rem;
    }
    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #475569;
      transition: all 0.25s ease;
    }
    .dot.active {
      background: #a78bfa;
      box-shadow: 0 0 6px rgba(167, 139, 250, 0.6);
    }

    /* ─── Empty spacer for scroll anchor ─────── */
    #scrollAnchor { height: 1px; flex-shrink: 0; }

    /* ─── Share Card (screenshot target) ─────── */
    #shareCard {
      background: linear-gradient(145deg, #13131f, #1a1a2e);
      border: 1px solid #2a2a4a;
      border-radius: 1rem;
      padding: 1.2rem;
    }

    /* ─── Golden Quote (top-dimension highlight) ─ */
    .golden-quote {
      position: relative;
      background: rgba(139, 92, 246, 0.08);
      border: 1px solid rgba(139, 92, 246, 0.25);
      border-radius: 0.75rem;
      padding: 0.8rem 1rem;
      margin-top: 0.6rem;
    }
    .golden-quote::before {
      content: '';
      position: absolute;
      top: 0;
      left: 20%;
      right: 20%;
      height: 2.5px;
      background: linear-gradient(90deg, transparent, #a855f7, #f97316, transparent);
      border-radius: 2px;
    }
    .golden-quote .gq-header {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      font-weight: 700;
      color: #f97316;
      margin-bottom: 0.35rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .golden-quote .gq-text {
      font-size: 0.82rem;
      line-height: 1.6;
      color: #e2e8f0;
    }

    /* ─── Watermark ──────────────────────────── */
    .watermark {
      font-size: 0.55rem;
      color: #475569;
      text-align: center;
      padding-top: 0.6rem;
      letter-spacing: 0.5px;
      font-family: 'JetBrains Mono', monospace;
    }

    /* ─── Button row (outside shareCard) ─────── */
    .btn-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.6rem;
      margin-top: 0.6rem;
    }
    .btn-row .restart-btn {
      width: auto;
      flex: 1;
      padding: 0.65rem 1rem;
    }
    .btn-row .screenshot-btn {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      flex: 1;
      padding: 0.65rem 1rem;
      background: rgba(30,30,60,0.6);
      border: 1px solid rgba(139, 92, 246, 0.35);
      border-radius: 0.7rem;
      color: #c4b5fd;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-row .screenshot-btn:active {
      transform: scale(0.96);
      background: rgba(99,102,241,0.15);
    }
    .btn-row .screenshot-btn:disabled {
      opacity: 0.5;
      cursor: default;
      transform: none;
    }

    /* ─── Canvas parent fix for screenshots ──── */
    #shareCard .relative {
      position: relative;
      width: 100%;
      max-width: 280px;
      margin: 0.75rem auto;
    }
    #shareCard .relative canvas {
      display: block;
      width: 100%;
      height: auto;
    }
  </style>
</head>
<body>

<!-- ─── Header ─────────────────────────────── -->
<div id="header">
  <span class="header-logo">hex.coach</span>
  <span style="font-size:0.7rem;color:#475569;">6D Cognitive Arena</span>
  <span class="header-progress" id="headerProgress"></span>
</div>

<!-- ─── Result Header Row (shown when game ends) ─ -->
<div id="resultHeaderRow">
  <span class="power" id="resultPower">⚔️ NET POWER: 0</span>
  <div class="badge-wrap">
    <span class="medal" id="resultMedal">🥉</span>
    <span class="rank-badge" id="resultRankBadge">—</span>
  </div>
</div>

<!-- ─── Chat (scrollable) ──────────────────── -->
<div id="chatContainer">
  <div id="chatInner"></div>
  <div id="scrollAnchor"></div>
</div>

<!-- ─── Fixed bottom timer bar ────────────── -->
<div id="bottomTimer"><div id="timerFill"></div></div>

<script>
// ═══════════════════════════════════════════════
//  Embedded quiz data (90 questions, 6 dimensions)

const QUIZ_DATA = {"dimensions":[{"name":"深海","emoji":"🌊","questions":[{"id":"deep_01","question":"马里亚纳海沟最深处（挑战者深渊）的水压约为海平面大气压的多少倍？","options":["约 110 倍","约 550 倍","约 1100 倍","约 5500 倍"],"answer":2,"explanation":"深度约 11,000 米，每 10 米增 1 个大气压，故约 1,100 倍。这相当于 50 架波音 747 叠在你脚上。"},{"id":"deep_02","question":"哪种深海生物能发出红光，且是已知唯一能看到红光并以此狩猎的鱼类？","options":["鮟鱇鱼","黑龙鱼","水母","深海鳕鱼"],"answer":1,"explanation":"黑龙鱼（Malacosteus）可发射远红光并用叶绿素衍生物感知它。多数深海鱼只看蓝光，而黑龙鱼拥有自己的夜视仪。"},{"id":"deep_03","question":"深海热泉（Hydrothermal Vent）生态系统的能量来源是什么？","options":["太阳光","地热与化学合成","海底火山岩浆","放射性衰变"],"answer":1,"explanation":"深海热泉依赖化能合成细菌将 H₂S 和 CO₂ 转化为有机物，完全不依赖光合作用——这是地球上独立于太阳的第二生物圈。"},{"id":"deep_04","question":"抹香鲸能下潜到约 2,000 米深处捕食大王乌贼，它的哪个器官帮助应对巨大水压？","options":["巨大的肺","头部的鲸蜡油","厚达 30 厘米的脂肪层","可塌缩的肋骨"],"answer":1,"explanation":"抹香鲸头部的鲸蜡油（Spermaceti）可在深潜时冷却凝固（密度变大），帮助浮力调节且保护脑部不被压扁，鲸蜡油也因此得名。"},{"id":"deep_05","question":"目前已知最深的活鱼记录是在什么深度发现的？","options":["约 4,000 米","约 5,800 米","约 8,300 米","约 10,900 米"],"answer":2,"explanation":"2014 年在马里亚纳海沟 8,143 米处发现狮子鱼（Pseudoliparis swirei）。2017 年日本深海科考又在 8,178 米拍到了同类。"}]},{"name":"星空","emoji":"⭐","questions":[{"id":"star_01","question":"一个秒差距（Parsec）大约相当于多少光年？","options":["1.5 光年","3.26 光年","5.88 光年","10.5 光年"],"answer":1,"explanation":"1 pc ≈ 3.2616 ly。定义：当天文单位（1 AU）对应 1 角秒的视差时，观测者与目标之间的距离。千年隼号跑完 Kessel 跑道的 12 pc 就是《星球大战》经典梗。"},{"id":"star_02","question":"中子星上一茶匙的物质在地球上大约有多重？","options":["10 吨","100 吨","1,000 万吨","10 亿吨"],"answer":3,"explanation":"中子星密度约 4×10¹⁷ kg/m³，一茶匙（5 mL）质量约 20 亿吨。这相当于将所有人类压缩到方糖大小。"},{"id":"star_03","question":"银河系中心超大质量黑洞的名称和最近确认的新闻是什么？","options":["M87*，2019 年首张照片","Sagittarius A*，2022 年事件视界望远镜发布照片","TON 618，被发现是宇宙最大黑洞","Cygnus X-1，2021 年质量更新"],"answer":1,"explanation":"人马座 A*（Sgr A*），质量约 400 万倍太阳。EHT 在 2022 年 5 月发布了其照片，距 M87* 首照三年后，证实了其存在。"},{"id":"star_04","question":"宇宙微波背景辐射（CMB）的温度大约是多少？","options":["零下 200°C","2.725 K","10 K","0 K"],"answer":1,"explanation":"CMB 是宇宙大爆炸约 38 万年后的余晖，当前温度 2.725 K（约 -270.4°C），是宇宙最完美的黑体辐射谱，精确度达 10⁻⁵。"}, // ─── Helpers ────────────────────────────────
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
function pickRandom(arr, n) {
  const copy = [...arr]; shuffle(copy); return copy.slice(0, n);
}
function scrollBottom() {
  requestAnimationFrame(() => anchor.scrollIntoView({ behavior: 'smooth' }));
}
function getInterpTier(score) {
  if (score <= 1) return 'low';
  if (score <= 3) return 'mid';
  return 'high';
}
function rankConfig(power) {
  if (power <= 2000) return { name: 'NEO WHITEHAT', sub: 'Fresh on the grid. Data streams still calibrating.', medal: '🥉' };

}

// ─── Build quiz ─────────────────────────────
function buildQuiz() {
  quiz = [];
  dimensionResults = {};
  for (const dim of QUIZ_DATA.dimensions) {
    const picked = pickRandom(dim.questions, 4);
    for (const q of picked) {
      quiz.push({ ...q, dimensionName: dim.name, dimensionEmoji: dim.emoji });
    }
    dimensionResults[dim.name] = { correct: 0, total: 4, emoji: dim.emoji };
  }
  shuffle(quiz);
}

// ─── Timer control ─────────────────────────
function startTimer() {
  clearInterval(timer);
  timerFill.style.width = '100%';
  timerFill.classList.remove('warning');
  const start = Date.now();
  const dur = 15 * 1000;
  timer = setInterval(() => {
    const elapsed = Date.now() - start;
    const remain = Math.max(0, dur - elapsed);
    const pct = (remain / dur) * 100;
    timerFill.style.width = pct + '%';
    timerFill.classList.toggle('warning', pct < 35);
    if (remain <= 0) {
      clearInterval(timer);
      if (!locked) handleTimeout();
    }
  }, 50);
}

function stopTimer() {
  clearInterval(timer);
  timerFill.style.width = '0%';
}

  goBtn.style.pointerEvents = 'none';
  addUserBubble(goBtn.textContent);
  addTypingBubble();
  setTimeout(() => {
    removeTyping();
    askQuestion();
  }, 600);
}

// ═══════════════════════════════════════════════
//  PHASE 3: Question
// ═══════════════════════════════════════════════
function askQuestion() {
  if (currentIndex >= quiz.length) { showResult(); return; }
  const q = quiz[currentIndex];
  headerProgress.textContent = `${currentIndex + 1}/${quiz.length}`;
  addAiBubble(`
    <div style="font-size:0.7rem;color:#818cf8;margin-bottom:0.3rem;">${q.dimensionEmoji} ${DIM_LABELS[q.dimensionName] || q.dimensionName}</div>
    <div style="font-weight:600;">${q.question}</div>
  `);
  const group = document.createElement('div');
  group.className = 'option-group';
  group.id = 'optionGroup';
  q.options.forEach((opt) => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.textContent = opt;
    btn.addEventListener('click', () => handleAnswer(opt, btn));
    group.appendChild(btn);
  });
  chatInner.appendChild(group);
  scrollBottom();
  startTimer();
  locked = false;
}

// ═══════════════════════════════════════════════
//  PHASE 4a: Answer
// ═══════════════════════════════════════════════
function handleAnswer(optionText, clickedBtn) {
  if (locked) return;
  locked = true;
  stopTimer();
  const q = quiz[currentIndex];
  const isCorrect = optionText === q.options[q.answer];
  const og = document.getElementById('optionGroup');
  if (og) og.remove();
  addUserBubble(optionText);
  let streakMsg = '';
  if (isCorrect) {
    correctCount++;
    streakCount++;
    dimensionResults[q.dimensionName].correct++;
    if (streakCount === 3) {
      streakMsg = '<div style="font-size:0.85rem;margin-top:0.25rem;color:#f97316;">🔥 COMBO! NEURAL CORES FULLY LEVERAGED!</div>';
    } else if (streakCount === 7) {
      streakMsg = '<div style="font-size:0.85rem;margin-top:0.25rem;color:#f97316;">⚡ OVERCLOCK MODE! CRUSHING THE MATRIX SYSTEM!</div>';
    } else if (streakCount === 10) {
      streakMsg = '<div style="font-size:0.85rem;margin-top:0.25rem;color:#f97316;">👑 FLAWLESS CLEAR! PEAK CARBON-BASED INTELLIGENCE!</div>';
    }
  } else {
    streakCount = 0;
  }
  addTypingBubble();
  setTimeout(() => {
    removeTyping();
    const tone = isCorrect ? pick(PRAISE) : pick(BOO);
    addAiBubble(`
      <div style="font-weight:700;margin-bottom:0.25rem;">${isCorrect ? '✅' : '💡'} ${tone}</div>
      ${streakMsg}
      <div style="color:#818cf8;font-size:0.82rem;margin-bottom:0.3rem;">${q.options[q.answer]}</div>
      <div style="color:#94a3b8;font-size:0.8rem;line-height:1.6;">${q.explanation}</div>
    `);
    currentIndex++;
    setTimeout(() => { askQuestion(); }, 1500);
  }, 700);
}

// ═══════════════════════════════════════════════
//  PHASE 4b: Timeout
// ═══════════════════════════════════════════════
function handleTimeout() {
  if (locked) return;
  locked = true;
  const q = quiz[currentIndex];
  document.querySelectorAll('.opt-btn').forEach((btn) => {
    btn.classList.add('disabled');
    if (btn.textContent === q.options[q.answer]) btn.classList.add('correct');
  });
  addAiBubble(`<div style="font-weight:700;margin-bottom:0.25rem;">⏰ ${pick(TIMEOUT_TEASE)}</div>`);
  locked = false;
  document.querySelectorAll('.opt-btn').forEach((btn) => {
    if (!btn.classList.contains('correct')) btn.classList.remove('disabled');
  });
  startTimer();
}

// ═══════════════════════════════════════════════
//  RESULT
// ═══════════════════════════════════════════════
function showResult() {
  stopTimer();
  headerProgress.textContent = '✓ COMPLETE';

  const dimOrder = ['DEEP_SEA', 'COSMOS', 'EX_RECORDS', 'CIVILIZATION', 'IQ_MATRIX', 'AI_CORE'];
  const dimData = dimOrder.map(name => dimensionResults[name] ? dimensionResults[name].correct : 0);
  const totalQuestions = dimensionResults[dimOrder[0]] ? dimensionResults[dimOrder[0]].total : 4;

  // ─── Compute rank & title ─────────────────────
  const totalPower = Math.round((correctCount / quiz.length) * 6000);
  const rc = rankConfig(totalPower);
  const rankName = rc.name;
  const rankSub = rc.sub;

  const titleMap = { 'DEEP_SEA': 'ABYSSAL IRONCLAD', 'COSMOS': 'PHANTOM STAR-RAIL', 'EX_RECORDS': 'FRONTIER NOMAD', 'CIVILIZATION': 'ARCHAIC DECODER', 'IQ_MATRIX': 'HIGH-DIM PARSER', 'AI_CORE': 'MATRIX PHANTOM' };
  const dimScores = dimOrder.map(name => ({ name, score: dimensionResults[name] ? dimensionResults[name].correct : 0 }));
  const maxScore = Math.max(...dimScores.map(d => d.score));
  const topDims = dimScores.filter(d => d.score === maxScore).map(d => d.name);
  let titleText = '';
  if (topDims.length === 1) {
    titleText = `【${titleMap[topDims[0]]}】`;
  } else if (topDims.length === 2) {
    titleText = `${titleMap[topDims[0]]} · ${titleMap[topDims[1]]} · Dual-Core Ignition`;
  } else if (topDims.length === 3) {
    titleText = `${topDims.map(d => titleMap[d]).join(' · ')} · Tri-Vector Resonance`;
  } else {
    titleText = 'Omni-Equilibrium · The Universal Foundation';
  }

  // ─── Find top dimension for golden quote ──────
  const topDimName = topDims[0] || dimOrder[0];
  const topDimData = dimensionResults[topDimName];
  const topTier = topDimData ? getInterpTier(topDimData.correct) : 'mid';
  const topQuoteText = DIM_INTERP[topDimName] ? DIM_INTERP[topDimName][topTier] : '';
  const topEmoji = topDimData ? topDimData.emoji : '🔥';

  // ─── Build shareCard content (screenshot target) ──
  const shareCardHtml = `
    <div id="shareCard">
      <div class="rank-display">${rankName}</div>
      <div class="rank-sub">${rankSub}</div>
      <div class="title-display">${titleText}</div>
      <div style="text-align:center;color:#64748b;font-size:0.75rem;margin-bottom:0.3rem;">COMBAT POWER: ${totalPower} / 6000</div>
      <div class="relative" style="width:100%;max-width:280px;margin:0.75rem auto;">
        <canvas id="radarChart" style="display:block;width:100%;height:auto;aspect-ratio:1/1;"></canvas>
      </div>

      <div class="golden-quote">
        <div class="gq-header">
          <span>🔥 ${topEmoji} ${DIM_LABELS[topDimName] || topDimName} · PRIME TALENT</span>
        </div>
        <div class="gq-text">${topQuoteText}</div>
      </div>

      <div class="watermark">⚡ HEX.COACH | Cyber-Agent Combat Assessment</div>
    </div>
  `;

  // ─── Build swipeable interpretation cards ────
  let cardsHtml = '';
  for (const name of dimOrder) {
    const data = dimensionResults[name];
    if (!data) continue;
    const tier = getInterpTier(data.correct);
    const interp = DIM_INTERP[name] ? DIM_INTERP[name][tier] : '';
    const emoji = data.emoji;
    cardsHtml += `<div class="snap-card">
      <div class="snap-card-inner">
        <div class="snap-card-header">
          <span class="dim-emoji">${emoji}</span>
          <span class="dim-name">${DIM_LABELS[name] || name}</span>
          <span class="dim-score">${data.correct}/${data.total}</span>
        </div>
        <div class="snap-card-text">${interp}</div>
      </div>
    </div>`;
  }

  // ─── Dots HTML ─────────────────────────────
  let dotsHtml = '';
  for (let i = 0; i < dimOrder.length; i++) {
    dotsHtml += `<span class="dot${i === 0 ? ' active' : ''}" data-index="${i}"></span>`;
  }

  // ─── Button row ────────────────────────────
  const buttonsHtml = `
    <div class="btn-row">
      <button class="restart-btn" onclick="restartGame()">[ 🔄 INITIATE REBOOT ]</button>
      <button class="screenshot-btn" id="screenshotBtn">📷 DEPLOY POSTER</button>
    </div>
  `;

  // ─── Assemble full result bubble ───────────
  addAiBubble(`
    ${shareCardHtml}
    <div class="snap-scroll" id="cardScroller">
      ${cardsHtml}
    </div>
    <div class="dots-wrap" id="cardDots">${dotsHtml}</div>
    ${buttonsHtml}
  `);

  // ─── Update result header ───────────────────
  resultPower.textContent = `⚔️ NET POWER: ${totalPower}`;
  resultMedal.textContent = rc.medal;
  resultRankBadge.textContent = rankName;
  resultHeaderRow.style.display = 'flex';

  // ─── Sync scroll snap dots ──────────────────
  const scroller = document.getElementById('cardScroller');
  const dotsContainer = document.getElementById('cardDots');
  if (scroller && dotsContainer) {
    scroller.addEventListener('scroll', () => {
      const idx = Math.round(scroller.scrollLeft / scroller.clientWidth);
      const dots = dotsContainer.querySelectorAll('.dot');
      dots.forEach((d, i) => d.classList.toggle('active', i === idx));
    });
  }

  // ─── Bind screenshot button ─────────────────
  setTimeout(() => {
    const btn = document.getElementById('screenshotBtn');
    if (btn) {
      btn.addEventListener('click', handleScreenshot);
    }
  }, 100);

  // ─── Render Radar Chart ─────────────────────
  requestAnimationFrame(() => {
    const canvas = document.getElementById('radarChart');
    if (!canvas) return;
    animateRadarChart(canvas, dimData, totalQuestions);
  });
}

// ═══════════════════════════════════════════════
//  Screenshot & Share
// ═══════════════════════════════════════════════
function handleScreenshot() {
  const card = document.getElementById('shareCard');
  const btn = document.getElementById('screenshotBtn');
  if (!card) return;
  if (btn) btn.disabled = true;

  html2canvas(card, {
    backgroundColor: '#0a0a0c',
    scale: 3,
    useCORS: true,
    allowTaint: true,
    logging: false
  }).then(canvas => {
    // Clear any potential shadow artifacts
    const ctx = canvas.getContext('2d');
    ctx.shadowColor = 'transparent';
    ctx.shadowBlur = 0;
    ctx.shadowOffsetX = 0;
    ctx.shadowOffsetY = 0;

    // Convert to blob for sharing/download
    canvas.toBlob(blob => {
      if (btn) btn.disabled = false;

      // Try navigator.share on mobile
      if (navigator.share && navigator.canShare && navigator.canShare({ files: [new File([blob], 'image.png', { type: 'image/png' })] })) {
        navigator.share({
          title: 'HEX.COACH Combat Assessment',
          text: 'Check out my Cyber-Agent combat assessment!',
          files: [new File([blob], `HEX_Agent_Square_${Date.now()}.png`, { type: 'image/png' })]
        }).catch(() => {
          // Fallback: download directly
          downloadPngFallback(canvas);
        });
      } else {
        // Fallback download
        downloadPngFallback(canvas);
      }
    }, 'image/png');
  }).catch(err => {
    console.error('Poster generation failed:', err);
    if (btn) btn.disabled = false;
  });
}

function downloadPngFallback(canvas) {
  const link = document.createElement('a');
  link.download = `HEX_Agent_Square_${Date.now()}.png`;
  link.href = canvas.toDataURL('image/png');
  link.click();
}

// ═══════════════════════════════════════════════
//  Radar Animation Engine
// ═══════════════════════════════════════════════
function animateRadarChart(canvas, actualData, totalQuestions = 4) {
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.parentElement.getBoundingClientRect();
  const size = Math.min(rect.width, rect.height);
  canvas.width = size * dpr;
  canvas.height = size * dpr;
  canvas.style.width = size + 'px';
  canvas.style.height = size + 'px';
  ctx.scale(dpr, dpr);

  const centerX = size / 2;
  const centerY = size / 2;
  const maxRadius = Math.min(centerX, centerY) - 50;

  const labels = ['DEEP SEA', 'COSMOS', 'WORLD RECORDS', 'ANCIENT CIV', 'IQ MATRIX', 'AI CORE'];
  const numAxes = labels.length;

  let startTime = null;
  const duration = 1500;

  function drawFrame(timestamp) {
    if (!startTime) startTime = timestamp;
    let progress = (timestamp - startTime) / duration;
    if (progress > 1) progress = 1;

    ctx.clearRect(0, 0, size, size);
    const currentMaxRadius = maxRadius * progress;

    for (let i = 1; i <= totalQuestions; i++) {
      const ringRadius = (currentMaxRadius / totalQuestions) * i;
      ctx.beginPath();
      for (let j = 0; j < numAxes; j++) {
        const angle = (Math.PI * 2 / numAxes) * j - Math.PI / 2;
        const x = centerX + Math.cos(angle) * ringRadius;
        const y = centerY + Math.sin(angle) * ringRadius;
        if (j === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.strokeStyle = `rgba(139, 92, 246, ${0.15 * progress})`;
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    ctx.beginPath();
    for (let j = 0; j < numAxes; j++) {
      const angle = (Math.PI * 2 / numAxes) * j - Math.PI / 2;
      ctx.moveTo(centerX, centerY);
      ctx.lineTo(centerX + Math.cos(angle) * currentMaxRadius, centerY + Math.sin(angle) * currentMaxRadius);
    }
    ctx.strokeStyle = `rgba(255, 255, 255, ${0.1 * progress})`;
    ctx.stroke();

    ctx.beginPath();
    for (let j = 0; j < numAxes; j++) {
      const angle = (Math.PI * 2 / numAxes) * j - Math.PI / 2;
      const scoreRatio = actualData[j] / totalQuestions;
      const currentScoreRadius = maxRadius * scoreRatio * progress;
      const x = centerX + Math.cos(angle) * currentScoreRadius;
      const y = centerY + Math.sin(angle) * currentScoreRadius;
      if (j === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.closePath();

    const fillGradient = ctx.createLinearGradient(0, 0, 0, size);
    fillGradient.addColorStop(0, `rgba(139, 92, 246, ${0.6 * progress})`);
    fillGradient.addColorStop(1, `rgba(249, 115, 22, ${0.15 * progress})`);
    ctx.fillStyle = fillGradient;
    ctx.fill();

    ctx.strokeStyle = `rgba(167, 139, 250, ${0.8 * progress})`;
    ctx.lineWidth = 2.5;
    ctx.stroke();

    for (let j = 0; j < numAxes; j++) {
      const angle = (Math.PI * 2 / numAxes) * j - Math.PI / 2;
      const scoreRatio = actualData[j] / totalQuestions;
      const currentScoreRadius = maxRadius * scoreRatio * progress;
      const x = centerX + Math.cos(angle) * currentScoreRadius;
      const y = centerY + Math.sin(angle) * currentScoreRadius;
      ctx.beginPath();
      ctx.arc(x, y, 4.5, 0, Math.PI * 2);
      ctx.fillStyle = '#f97316';
      ctx.fill();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }

    if (progress === 1) {
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 13px monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      for (let j = 0; j < numAxes; j++) {
        const angle = (Math.PI * 2 / numAxes) * j - Math.PI / 2;
        const labelX = centerX + Math.cos(angle) * (maxRadius + 20);
        const labelY = centerY + Math.sin(angle) * (maxRadius + 20);
        ctx.fillText(labels[j], labelX, labelY);
      }
      triggerLightConfetti();
    } else {
      requestAnimationFrame(drawFrame);
    }
  }

  requestAnimationFrame(drawFrame);
}

// ═══════════════════════════════════════════════
//  Confetti
// ═══════════════════════════════════════════════
function triggerLightConfetti() {
  if (typeof confetti !== 'function') return;
  confetti({
    particleCount: 40,
    spread: 60,
    origin: { y: 0.7 },
    colors: ['#8b5cf6', '#f97316', '#3b82f6', '#10b981']
  });
}

// ═══════════════════════════════════════════════
//  Restart & Boot
// ═══════════════════════════════════════════════
function restartGame() {
  locked = true;
  clearInterval(timer);
  initGame();
  locked = false;
}

initGame();
