<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>hex.coach — 6D Cognitive Arena</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script defer src="https://umami-production-922a.up.railway.app/script.js" data-website-id="39feeb44-ac0c-41a5-ba3c-fc0bff86d406"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: 'Inter', sans-serif;
      background: #08080e;
      color: #e2e8f0;
      display: flex;
      flex-direction: column;
    }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #2a2a4a; border-radius: 2px; }

    /* ─── Header ─────────────────────────────── */
    #header {
      flex-shrink: 0;
      padding: 0.7rem 1rem;
      background: rgba(10,10,18,0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid #1e1e3a;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      z-index: 20;
    }
    .header-logo {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 800;
      font-size: 1.1rem;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .header-progress {
      font-size: 0.7rem;
      color: #475569;
      margin-left: auto;
    }

    /* ─── Result header row (hidden by default) ─── */
    #resultHeaderRow {
      display: none;
      flex-shrink: 0;
      padding: 0.5rem 1rem;
      background: rgba(10,10,18,0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid #1e1e3a;
      align-items: center;
      gap: 0.6rem;
      z-index: 20;
    }
    #resultHeaderRow .power {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.88rem;
      font-weight: 700;
      color: #a78bfa;
      white-space: nowrap;
    }
    #resultHeaderRow .badge-wrap {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    #resultHeaderRow .medal {
      font-size: 1.2rem;
    }
    #resultHeaderRow .rank-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.88rem;
      font-weight: 700;
      background: linear-gradient(135deg, #a855f7, #f97316);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      white-space: nowrap;
    }

    /* ─── Chat container ─────────────────────── */
    #chatContainer {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 0.75rem 0.75rem 0.5rem;
      scroll-behavior: smooth;
    }
    #chatInner {
      max-width: 640px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    /* ─── Bubbles ────────────────────────────── */
    .bubble {
      max-width: 88%;
      border-radius: 1rem;
      padding: 0.7rem 0.9rem;
      font-size: 0.88rem;
      line-height: 1.55;
      animation: fadeUp 0.3s ease;
      word-break: break-word;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .bubble-ai {
      align-self: flex-start;
      background: linear-gradient(145deg, #1a1a2e, #16162a);
      border: 1px solid #2a2a4a;
      color: #e2e8f0;
      border-bottom-left-radius: 0.25rem;
    }
    .bubble-ai .author {
      font-size: 0.65rem;
      color: #6366f1;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.3rem;
      margin-bottom: 0.3rem;
    }
    .bubble-ai .author .avatar {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 20px; height: 20px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-radius: 50%;
      font-size: 0.6rem;
      color: #fff;
    }

    .bubble-user {
      align-self: flex-end;
      background: linear-gradient(135deg, #4f46e5, #6366f1);
      color: #fff;
      border-bottom-right-radius: 0.25rem;
    }

    /* ─── Inline option buttons ──────────────── */
    .option-group {
      align-self: flex-end;
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      justify-content: flex-end;
      max-width: 88%;
      animation: fadeUp 0.3s ease;
    }
    .opt-btn {
      flex: 0 1 auto;
      padding: 0.55rem 0.85rem;
      background: rgba(30,30,60,0.7);
      border: 1px solid #2e2e52;
      border-radius: 0.7rem;
      color: #cbd5e1;
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      -webkit-tap-highlight-color: transparent;
      white-space: normal;
      word-break: break-word;
      max-width: 100%;
      line-height: 1.4;
      text-align: left;
    }
    .opt-btn:active {
      animation: btnElastic 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes btnElastic {
      0%   { transform: scale(1); }
      25%  { transform: scale(0.93); }
      50%  { transform: scale(1.06); }
      75%  { transform: scale(0.97); }
      100% { transform: scale(1); }
    }
    .opt-btn:hover:not(.disabled) {
      background: rgba(99,102,241,0.15);
      border-color: #6366f1;
      color: #e2e8f0;
    }
    .opt-btn.correct {
      background: rgba(34,197,94,0.18);
      border-color: #22c55e;
      color: #86efac;
    }
    .opt-btn.wrong {
      background: rgba(239,68,68,0.18);
      border-color: #ef4444;
      color: #fca5a5;
    }
    .opt-btn.disabled { cursor: default; opacity: 0.6; }

    /* ─── GO! inline ─────────────────────────── */
    .go-inline {
      align-self: flex-end;
      padding: 0.7rem 2.2rem;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border: none;
      border-radius: 999px;
      color: #fff;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s;
      -webkit-tap-highlight-color: transparent;
    }
    .go-inline:active { transform: scale(0.94); }
    .go-inline.disabled { opacity: 0.4; cursor: default; transform: none; }

    /* ─── Fixed bottom timer bar ─────────────── */
    #bottomTimer {
      flex-shrink: 0;
      height: 3px;
      background: #1e1e3a;
      z-index: 30;
    }
    #timerFill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #6366f1, #a855f7);
      transition: width 0.1s linear;
    }
    #timerFill.warning { background: linear-gradient(90deg, #f59e0b, #ef4444); }

    /* ─── Typing dots ────────────────────────── */
    .typing-dots {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.3rem 0.1rem;
    }
    .typing-dots span {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #6366f1;
      animation: dotPulse 1.2s infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes dotPulse {
      0%,60%,100% { opacity: 0.3; transform: scale(1); }
      30% { opacity: 1; transform: scale(1.3); }
    }

    /* ─── Result card ────────────────────────── */
    .result-card {
      background: linear-gradient(145deg, #13131f, #1a1a2e);
      border: 1px solid #2a2a4a;
      border-radius: 1rem;
      padding: 1.2rem;
      margin-top: 0.3rem;
    }
    .rank-display {
      font-family: 'JetBrains Mono', monospace;
      font-size: 2rem;
      font-weight: 800;
      text-align: center;
      background: linear-gradient(135deg, #a855f7, #f97316);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.3;
    }
    .rank-sub {
      text-align: center;
      font-size: 0.75rem;
      color: #64748b;
      margin-bottom: 0.4rem;
    }
    .title-display {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      font-weight: 600;
      text-align: center;
      color: #c4b5fd;
      margin-bottom: 0.3rem;
      line-height: 1.4;
    }
    .restart-btn {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      flex: 1;
      padding: 0.65rem 1rem;
      background: rgba(30,30,60,0.6);
      border: 1px solid rgba(139, 92, 246, 0.35);
      border-radius: 0.7rem;
      color: #c4b5fd;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s;
      -webkit-tap-highlight-color: transparent;
    }
    .restart-btn:active { transform: scale(0.96); background: rgba(99,102,241,0.15); }

    /* ─── Scroll Snap Card Container ─────────── */
    .snap-scroll {
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      width: 100%;
      padding: 0.5rem 0;
    }
    .snap-scroll::-webkit-scrollbar { display: none; }
    .snap-scroll { -ms-overflow-style: none; scrollbar-width: none; }
    .snap-card {
      width: 100%;
      flex-shrink: 0;
      scroll-snap-align: center;
      padding: 0 0.25rem;
    }
    .snap-card-inner {
      background: rgba(30,30,60,0.6);
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 0.75rem;
      padding: 1rem 1rem;
    }
    .snap-card-header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }
    .snap-card-header .dim-emoji { font-size: 1.2rem; }
    .snap-card-header .dim-name {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: 0.9rem;
      color: #c4b5fd;
    }
    .snap-card-header .dim-score {
      margin-left: auto;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      color: #64748b;
    }
    .snap-card-text {
      font-size: 0.82rem;
      line-height: 1.65;
      color: #94a3b8;
    }

    /* ─── Dot indicators ─────────────────────── */
    .dots-wrap {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      margin-top: 0.4rem;
      margin-bottom: 0.6rem;
    }
    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #475569;
      transition: all 0.25s ease;
    }
    .dot.active {
      background: #a78bfa;
      box-shadow: 0 0 6px rgba(167, 139, 250, 0.6);
    }

    /* ─── Empty spacer for scroll anchor ─────── */
    #scrollAnchor { height: 1px; flex-shrink: 0; }

    /* ─── Share Card (screenshot target) ─────── */
    #shareCard {
      background: linear-gradient(145deg, #13131f, #1a1a2e);
      border: 1px solid #2a2a4a;
      border-radius: 1rem;
      padding: 1.2rem;
    }

    /* ─── Golden Quote (top-dimension highlight) ─ */
    .golden-quote {
      position: relative;
      background: rgba(139, 92, 246, 0.08);
      border: 1px solid rgba(139, 92, 246, 0.25);
      border-radius: 0.75rem;
      padding: 0.8rem 1rem;
      margin-top: 0.6rem;
    }
    .golden-quote::before {
      content: '';
      position: absolute;
      top: 0;
      left: 20%;
      right: 20%;
      height: 2.5px;
      background: linear-gradient(90deg, transparent, #a855f7, #f97316, transparent);
      border-radius: 2px;
    }
    .golden-quote .gq-header {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      font-weight: 700;
      color: #f97316;
      margin-bottom: 0.35rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .golden-quote .gq-text {
      font-size: 0.82rem;
      line-height: 1.6;
      color: #e2e8f0;
    }

    /* ─── Watermark ──────────────────────────── */
    .watermark {
      font-size: 0.85rem;
      color: #94a3b8;
      text-align: center;
      padding-top: 0.8rem;
      padding-bottom: 0.4rem;
      letter-spacing: 0.5px;
      font-family: 'JetBrains Mono', monospace;
    }
    .wm-hex {
      background: linear-gradient(135deg, #6366f1, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 700;
      font-size: 0.9rem;
    }
    .wm-combat {
      color: #94a3b8;
      font-weight: 500;
      font-size: 0.75rem;
    }

    /* ─── Button row (outside shareCard) ─────── */
    .btn-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.6rem;
      margin-top: 0.6rem;
    }
    .btn-row .restart-btn {
      width: auto;
      flex: 1;
      padding: 0.65rem 1rem;
    }
    .btn-row .screenshot-btn {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      flex: 1;
      padding: 0.65rem 1rem;
      background: rgba(30,30,60,0.6);
      border: 1px solid rgba(139, 92, 246, 0.35);
      border-radius: 0.7rem;
      color: #c4b5fd;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-row .screenshot-btn:active {
      transform: scale(0.96);
      background: rgba(99,102,241,0.15);
    }
    .btn-row .screenshot-btn:disabled {
      opacity: 0.5;
      cursor: default;
      transform: none;
    }

    /* ─── Canvas parent fix for screenshots ──── */
    #shareCard .relative {
      position: relative;
      width: 100%;
      max-width: 280px;
      margin: 0.75rem auto;
    }
    #shareCard .relative canvas {
      display: block;
      width: 100%;
      height: auto;
    }
  </style>
</head>

<!-- ─── Privacy link (barely visible hacker-style) ─ -->
<div class="fixed top-4 right-4 z-50 font-mono text-[10px] opacity-30 hover:opacity-80 transition-opacity duration-300">

    <span class="medal" id="resultMedal">🥉</span>

  </div>
</div>

</div>

<div id="bottomTimer"><div id="timerFill"></div></div>

<script>
// ═══════════════════════════════════════════════
//  Embedded quiz data (90 questions, 6 dimensions)
// ═══════════════════════════════════════════════
const QUIZ_DATA = {"dimensions":[{"name":"DEEP_SEA","emoji":"🌊","questions":[{"id":"deep_01","question":"What is the water pressure at the deepest point of the Mariana Trench (Challenger Deep) relative to sea level?","options":["~110 times","~550 times","~1,100 times","~5,500 times"],"answer":2,"explanation":"At ~11,000 meters down, pressure scales by 1 atm per 10m, reaching ~1,100 atm. That is equivalent to 50 Boeing 747s stacked on your toes."},{"id":"deep_02","question":"Which deep-sea creature emits red light and is the only known fish that can see red light to hunt?","options":["Anglerfish","Black Dragonfish","Deep-sea Jellyfish","Deep-sea Cod"],"answer":1,"explanation":"The Black Dragonfish (Malacosteus) flashes far-red light and detects it via chlorophyll derivatives. Most deep-sea life only sees blue light, meaning this fish carries its own stealth night-vision goggles."},{"id":"deep_03","question":"What serves as the primary energy source for Hydrothermal Vent ecosystems?","options":["Solar Radiation","Geothermal & Chemosynthesis","Submarine Lava Flow","Radioactive Decay"],"answer":1,"explanation":"Hydrothermal vents rely on chemosynthetic bacteria converting H₂S and CO₂ into organic matter. This forms a completely separate biosphere on Earth that is independent of the Sun."},{"id":"deep_04","question":"Sperm whales dive down to 2,000m (~6,500 ft) to hunt giant squids. Which organ directly assists them in managing extreme pressure?","options":["Enormous Lung Capacity","Spermaceti Organ","30-cm Thick Blubber Layer","Collapsible Rib Cage"],"answer":1,"explanation":"The spermaceti oil in their heads cools and solidifies during deep dives, adjusting buoyancy and buffering the brain cavity against crushing pressures."},{"id":"deep_05","question":"At what depth was the deepest living fish record captured by marine scientists?","options":["~4,000 meters","~5,800 meters","~8,300 meters","~10,900 meters"],"answer":2,"explanation":"The Mariana Snailfish (Pseudoliparis swirei) was filmed alive at 8,143 meters in 2014, and later clocked at 8,178 meters (~26,830 ft) by a Japanese research expedition in 2017."}]},{"name":"COSMOS","emoji":"⭐","questions":[{"id":"star_01","question":"One parsec (pc) is approximately equivalent to how many light-years?","options":["1.5 light-years","3.26 light-years","5.88 light-years","10.5 light-years"],"answer":1,"explanation":"1 pc ≈ 3.2616 ly. Defined as the distance at which 1 AU subtends an angle of 1 arcsecond. Han Solo's famous Millennium Falcon '12 parsecs' boast is a classic reference to this."},{"id":"star_02","question":"Approximately how much would one teaspoon of matter from a neutron star weigh on Earth?","options":["10 tons","100 tons","10 million tons","2 billion tons"],"answer":3,"explanation":"With a density of ~4×10¹⁷ kg/m³, a single teaspoon (5 mL) weighs about 2 billion tons. That is equivalent to compressing the entire human race into a single sugar cube."},{"id":"star_03","question":"What is the designation of the supermassive black hole at the center of the Milky Way, and its latest confirmed milestone?","options":["M87*, first-ever photo captured in 2019","Sagittarius A*, Event Horizon Telescope image released in 2022","TON 618, discovered as the largest black hole in the universe","Cygnus X-1, mass metrics updated in 2021"],"answer":1,"explanation":"Sagittarius A* (Sgr A*), packing ~4 million solar masses, had its event horizon direct image published by the EHT team in May 2022, confirming its existence three years after M87*."},{"id":"star_04","question":"What is the cosmic microwave background (CMB) radiation temperature?","options":["-200°C (-328°F)","2.725 K","10 K","0 K"],"answer":1,"explanation":"The CMB is the afterglow of the Big Bang from ~380,000 years ago. It has cooled down to a uniform 2.725 K (-270.4°C / -454.8°F), making it the most perfect blackbody spectrum in physics."},{"id":"star_05","question":"What is the extreme orbital speed of the exoplanet Swift J1756.9-2508 around its host neutron star, and why?","options":["~1,000 km/s (621 mi/s), due to binary gravitational slingshot","~480 km/s (298 mi/s), caused by stellar tidal stripping","~200 km/s (124 mi/s), propelled by supermassive black hole ejection","~50 km/s (31 mi/s), bound by standard stellar mass core"],"answer":0,"explanation":"It orbits a neutron star at ~1,000 km/s (compared to Earth's 30 km/s). If it were placed in our solar system, traveling from Earth to the Moon would take less than 6 minutes."}]},{"name":"EX_RECORDS","emoji":"🏆","questions":[{"id":"record_01","question":"What is the longest continuous mountain range on planet Earth?","options":["The Himalayas","The Andes","The Mid-Ocean Ridge","The Rockies"],"answer":2,"explanation":"The Mid-Ocean Ridge stretches over 65,000 km (40,390 mi). It is almost entirely underwater. The Andes, at 7,000 km, is less than a tenth of its length."},{"id":"record_02","question":"What is the shortest-lived vertebrate animal known to science?","options":["Mayfly","Woolly Bear Caterpillar","Coral Reef Pygmy Goby","Male Hummingbird"],"answer":2,"explanation":"The Pygmy Goby (Eviota sigillata) has a maximum lifespan of just 59 days. Mayfly larvae can live for years before their brief adult phase, making the Goby much shorter-lived overall."},{"id":"record_03","question":"Which is the most luminous known quasar in the observable universe?","options":["3C 273","S5 0014+81","SMSS J2157-3602","TON 618"],"answer":3,"explanation":"TON 618 shines with a luminosity of 4×10⁴¹ Watts, equal to 140 trillion Suns. Housing a central black hole of 66 billion solar masses, it stands as the brightest and largest single object cataloged."},{"id":"record_04","question":"Where is the absolute driest place (lowest recorded precipitation) on Earth?","options":["Sahara Desert","McMurdo Dry Valleys","Atacama Desert","Gobi Desert"],"answer":1,"explanation":"While Chile's Atacama Desert is incredibly arid, Antarctica's McMurdo Dry Valleys have seen zero precipitation for millions of years. It is Earth's ultimate low-moisture zone."},{"id":"record_05","question":"What is the farthest human-made object from Earth, and approximately how far is it?","options":["Voyager 1, ~24 billion km","New Horizons, ~8 billion km","Pioneer 10, ~12 billion km","Voyager 2, ~20 billion km"],"answer":0,"explanation":"Launched in 1977, Voyager 1 is over 162 AU (~24 billion km / 15 billion mi) away, cruising in interstellar space. Its radio signals take over 22.5 hours to reach Earth."}]},{"name":"CIVILIZATION","emoji":"🏛️","questions":[{"id":"ancient_01","question":"Which of the following is recognized as the oldest surviving legal code in history?","options":["Code of Hammurabi","Code of Ur-Nammu","Twelve Tables","Laws of Manu"],"answer":1,"explanation":"The Sumerian Code of Ur-Nammu (c. 2100 BCE) predates Hammurabi by ~300 years. It was highly progressive, opting for financial fines instead of physical mutilation."},{"id":"ancient_02","question":"What mechanical property did the copper tools used by ancient Egyptians to build pyramids most critically lack?","options":["Hardness","Ductility","Corrosion Resistance","Density"],"answer":0,"explanation":"Pure copper scores a 3 on the Mohs scale, while granite is a 7. Workers had to use copper saws embedded with abrasive quartz sand, sacrificing brute hardness for abrasive cutting."},{"id":"ancient_03","question":"What was the true geographic location of the ancient city of Troy according to modern archeology?","options":["Near Athens, Greece","Hisarlik, Turkey","Sicily, Italy","Alexandria, Egypt"],"answer":1,"explanation":"In 1870, Heinrich Schliemann excavated a 9-layer deep archaeological site at Hisarlik, Turkey. Troy Layer VII (c. 1300 BCE) is verified as the historical city matching Homer's Iliad."},{"id":"ancient_04","question":"What is the symbol for zero '0' in the ancient Mayan vigesimal numeral system?","options":["A Single Dot","A Horizontal Bar","A Shell or Eye Symbol", // ─── Helpers ────────────────────────────────
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
function pickRandom(arr, n) {
  const copy = [...arr]; shuffle(copy); return copy.slice(0, n);
}
function scrollBottom() {
  requestAnimationFrame(() => anchor.scrollIntoView({ behavior: 'smooth' }));
}
function getInterpTier(score) {
  if (score <= 1) return 'low';
  if (score <= 3) return 'mid';
  return 'high';
}
function rankConfig(power) {
  if (power <= 2000) return { name: 'NEO WHITEHAT', sub: 'Fresh on the grid. Data streams still calibrating.', medal: '🥉' };
  if (power <= 4000) return { name: 'FISSION WALKER', sub: 'System-wide awareness online. Steady ascent underway.', medal: '🥈' };
  return { name: 'OMNI OVERLORD', sub: 'Zero blind spots. Approaching full-spectrum combat readiness.', medal: '🥇' };
}

// ─── Build quiz ─────────────────────────────
function buildQuiz() {
  quiz = [];
  dimensionResults = {};
  for (const dim of QUIZ_DATA.dimensions) {
    const picked = pickRandom(dim.questions, 4);
    for (const q of picked) {
      quiz.push({ ...q, dimensionName: dim.name, dimensionEmoji: dim.emoji });
    }
    dimensionResults[dim.name] = { correct: 0, total: 4, emoji: dim.emoji };
  }
  shuffle(quiz);
}

// ─── Timer control ─────────────────────────
function startTimer() {
  clearInterval(timer);
  timerFill.style.width = '100%';
  timerFill.classList.remove('warning');
  const start = Date.now();
  const dur = 15 * 1000;
  timer = setInterval(() => {
    const elapsed = Date.now() - start;
    const remain = Math.max(0, dur - elapsed);
    const pct = (remain / dur) * 100;
    timerFill.style.width = pct + '%';
    timerFill.classList.toggle('warning', pct < 35);
    if (remain <= 0) {
      clearInterval(timer);
      if (!locked) handleTimeout();
    }
  }, 50);
}

function stopTimer() {
  clearInterval(timer);
  timerFill.style.width = '0%';
}

function handleGo(goBtn) {
  if (locked || !initialGo) return;
  locked = true;
  initialGo = false;
  goBtn.classList.add('disabled');
  goBtn.style.pointerEvents = 'none';
  addUserBubble(goBtn.textContent);
  addTypingBubble();
  setTimeout(() => {
    removeTyping();
    askQuestion();
  }, 600);

function askQuestion() {
  if (currentIndex >= quiz.length) { showResult(); return; }
  const q = quiz[currentIndex];
  headerProgress.textContent = `${currentIndex + 1}/${quiz.length}`;
  addAiBubble(`
    <div style="font-size:0.7rem;color:#818cf8;margin-bottom:0.3rem;">${q.dimensionEmoji} ${DIM_LABELS[q.dimensionName] || q.dimensionName}</div>
    <div style="font-weight:600;">${q.question}</div>
  `);
  const group = document.createElement('div');
  group.className = 'option-group';
  group.id = 'optionGroup';
  q.options.forEach((opt) => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.textContent = opt;
    btn.addEventListener('click', () => handleAnswer(opt, btn));
    group.appendChild(btn);
  });
  chatInner.appendChild(group);
  scrollBottom();
  startTimer();
  locked = false;
}

function handleAnswer(optionText, clickedBtn) {
  if (locked) return;
  locked = true;
  stopTimer();
  const q = quiz[currentIndex];
  const isCorrect = optionText === q.options[q.answer];
  const og = document.getElementById('optionGroup');
  if (og) og.remove();
  addUserBubble(optionText);
  let streakMsg = '';
  if (isCorrect) {
    correctCount++;
    streakCount++;
    dimensionResults[q.dimensionName].correct++;
    if (streakCount === 3) {
      streakMsg = '<div style="font-size:0.85rem;margin-top:0.25rem;color:#f97316;">🔥 COMBO! NEURAL CORES FULLY LEVERAGED!</div>';
    } else if (streakCount === 7) {
      streakMsg = '<div style="font-size:0.85rem;margin-top:0.25rem;color:#f97316;">⚡ OVERCLOCK MODE! CRUSHING THE MATRIX SYSTEM!</div>';
    } else if (streakCount === 10) {
      streakMsg = '<div style="font-size:0.85rem;margin-top:0.25rem;color:#f97316;">👑 FLAWLESS CLEAR! PEAK CARBON-BASED INTELLIGENCE!</div>';
    }
  } else {
    streakCount = 0;
  }
  addTypingBubble();
  setTimeout(() => {
    removeTyping();
    const tone = isCorrect ? pick(PRAISE) : pick(BOO);
    addAiBubble(`
      <div style="font-weight:700;margin-bottom:0.25rem;">${isCorrect ? '✅' : '💡'} ${tone}</div>

    currentIndex++;
    setTimeout(() => { askQuestion(); }, 1500);
  }, 700);
}

// ═══════════════════════════════════════════════
//  PHASE 4b: Timeout
// ═══════════════════════════════════════════════
function handleTimeout() {
  if (locked) return;
  locked = true;
  const q = quiz[currentIndex];
  document.querySelectorAll('.opt-btn').forEach((btn) => {
    btn.classList.add('disabled');
    if (btn.textContent === q.options[q.answer]) btn.classList.add('correct');
  });
  addAiBubble(`<div style="font-weight:700;margin-bottom:0.25rem;">⏰ ${pick(TIMEOUT_TEASE)}</div>`);
  locked = false;
  document.querySelectorAll('.opt-btn').forEach((btn) => {
    if (!btn.classList.contains('correct')) btn.classList.remove('disabled');
  });
  startTimer();
}

  const buttonsHtml = `
    <div class="btn-row">
      <button class="restart-btn" onclick="restartGame()">TRY AGAIN</button>
      <button class="screenshot-btn" id="screenshotBtn">📷 DEPLOY POSTER</button>
    </div>
  `;

  // ─── Assemble full result bubble ───────────
  addAiBubble(`
    ${shareCardHtml}
    <div class="snap-scroll" id="cardScroller">
      ${cardsHtml}
    </div>
    <div class="dots-wrap" id="cardDots">${dotsHtml}</div>
    ${buttonsHtml}
  `);

  // ─── Update result header ───────────────────
  resultPower.textContent = `⚔️ NET POWER: ${totalPower}`;
  resultMedal.textContent = rc.medal;
  resultRankBadge.textContent = rankName;
  resultHeaderRow.style.display = 'flex';

  // ─── Sync scroll snap dots ──────────────────
  const scroller = document.getElementById('cardScroller');
  const dotsContainer = document.getElementById('cardDots');
  if (scroller && dotsContainer) {
    scroller.addEventListener('scroll', () => {
      const idx = Math.round(scroller.scrollLeft / scroller.clientWidth);
      const dots = dotsContainer.querySelectorAll('.dot');
      dots.forEach((d, i) => d.classList.toggle('active', i === idx));
    });
  }

  // ─── Bind screenshot button ─────────────────
  setTimeout(() => {
    const btn = document.getElementById('screenshotBtn');
    if (btn) {
      btn.addEventListener('click', handleScreenshot);
    }
  }, 100);

  // ─── Render Radar Chart ─────────────────────
  requestAnimationFrame(() => {
    const canvas = document.getElementById('radarChart');
    if (!canvas) return;
    animateRadarChart(canvas, dimData, totalQuestions);
  });
}

// ═══════════════════════════════════════════════
//  Screenshot & Share
// ═══════════════════════════════════════════════
function handleScreenshot() {
  const card = document.getElementById('shareCard');
  const btn = document.getElementById('screenshotBtn');
  if (!card) return;
  if (btn) btn.disabled = true;

  // ─── Patch gradient text before capture ───────
  // html2canvas doesn't render -webkit-background-clip:text (gradient text)
  // .rank-display is SVG (fully compatible), but watermark spans (.wm-hex/.wm-combat) and .gq-header need patching
  const rankEls = card.querySelectorAll('.gq-header, .wm-hex, .wm-combat');
  const patched = [];
  rankEls.forEach(el => {
    patched.push(el);
    // Save original inline styles
    el.dataset.patchFill = el.style.getPropertyValue('-webkit-text-fill-color') || '';
    el.dataset.patchBg = el.style.getPropertyValue('background') || '';
    el.dataset.patchClip = el.style.getPropertyValue('-webkit-background-clip') || '';
    el.dataset.patchColor = el.style.color || '';
    // Apply solid color patch
    el.style.setProperty('-webkit-text-fill-color', '#c4b5fd', 'important');
    el.style.setProperty('background', 'none', 'important');
    el.style.setProperty('-webkit-background-clip', 'unset', 'important');
  });

  html2canvas(card, {
    backgroundColor: null,
    scale: 3,
    useCORS: true,
    allowTaint: true,
    logging: false
  }).then(canvas => {
    // ─── Restore gradient text ────────────────
    patched.forEach(el => {
      el.style.setProperty('-webkit-text-fill-color', el.dataset.patchFill || 'transparent');
      el.style.setProperty('background', el.dataset.patchBg || '');
      el.style.setProperty('-webkit-background-clip', el.dataset.patchClip || '');
      el.style.color = el.dataset.patchColor || '';
      delete el.dataset.patchFill;
      delete el.dataset.patchBg;
      delete el.dataset.patchClip;
      delete el.dataset.patchColor;
    });

    // Convert to blob for sharing/download
    canvas.toBlob(blob => {
      if (btn) btn.disabled = false;

      // Try navigator.share on mobile
      if (navigator.share && navigator.canShare && navigator.canShare({ files: [new File([blob], 'image.png', { type: 'image/png' })] })) {
        navigator.share({
          title: 'HEX.COACH Combat Assessment',
          text: 'Check out my Cyber-Agent combat assessment!',
          files: [new File([blob], `HEX_Agent_Square_${Date.now()}.png`, { type: 'image/png' })]
        }).catch(() => {
          // Fallback: download directly
          downloadPngFallback(canvas);
        });
      } else {
        // Fallback download
        downloadPngFallback(canvas);
      }
    }, 'image/png');
  }).catch(err => {
    console.error('Poster generation failed:', err);
    if (btn) btn.disabled = false;
  });
}

function downloadPngFallback(canvas) {
  const link = document.createElement('a');
  link.download = `HEX_Agent_Square_${Date.now()}.png`;
  link.href = canvas.toDataURL('image/png');
  link.click();
}

// ═══════════════════════════════════════════════
//  Radar Animation Engine
// ═══════════════════════════════════════════════
function animateRadarChart(canvas, actualData, totalQuestions = 4) {
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.parentElement.getBoundingClientRect();
  const size = Math.min(rect.width, rect.height);
  canvas.width = size * dpr;
  canvas.height = size * dpr;
  canvas.style.width = size + 'px';
  canvas.style.height = size + 'px';
  ctx.scale(dpr, dpr);

  const centerX = size / 2;
  const centerY = size / 2;
  const maxRadius = Math.min(centerX, centerY) - 50;

  const labels = ['DEEP SEA', 'COSMOS', 'WORLD RECORDS', 'ANCIENT CIV', 'IQ MATRIX', 'AI CORE'];
  const numAxes = labels.length;

  let startTime = null;
  const duration = 1500;

  function drawFrame(timestamp) {
    if (!startTime) startTime = timestamp;
    let progress = (timestamp - startTime) / duration;
    if (progress > 1) progress = 1;

    ctx.clearRect(0, 0, size, size);
    const currentMaxRadius = maxRadius * progress;

    for (let i = 1; i <= totalQuestions; i++) {
      const ringRadius = (currentMaxRadius / totalQuestions) * i;
      ctx.beginPath();
      for (let j = 0; j < numAxes; j++) {
        const angle = (Math.PI * 2 / numAxes) * j - Math.PI / 2;
        const x = centerX + Math.cos(angle) * ringRadius;
        const y = centerY + Math.sin(angle) * ringRadius;
        if (j === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.strokeStyle = `rgba(139, 92, 246, ${0.15 * progress})`;
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    ctx.beginPath();
    for (let j = 0; j < numAxes; j++) {
      const angle = (Math.PI * 2 / numAxes) * j - Math.PI / 2;
      ctx.moveTo(centerX, centerY);
      ctx.lineTo(centerX + Math.cos(angle) * currentMaxRadius, centerY + Math.sin(angle) * currentMaxRadius);
    }
    ctx.strokeStyle = `rgba(255, 255, 255, ${0.1 * progress})`;
    ctx.stroke();

    ctx.beginPath();
    for (let j = 0; j < numAxes; j++) {
      const angle = (Math.PI * 2 / numAxes) * j - Math.PI / 2;
      const scoreRatio = actualData[j] / totalQuestions;
      const currentScoreRadius = maxRadius * scoreRatio * progress;
      const x = centerX + Math.cos(angle) * currentScoreRadius;
      const y = centerY + Math.sin(angle) * currentScoreRadius;
      if (j === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.closePath();

    const fillGradient = ctx.createLinearGradient(0, 0, 0, size);
    fillGradient.addColorStop(0, `rgba(139, 92, 246, ${0.6 * progress})`);
    fillGradient.addColorStop(1, `rgba(249, 115, 22, ${0.15 * progress})`);
    ctx.fillStyle = fillGradient;
    ctx.fill();

    ctx.strokeStyle = `rgba(167, 139, 250, ${0.8 * progress})`;
    ctx.lineWidth = 2.5;
    ctx.stroke();

    for (let j = 0; j < numAxes; j++) {
      const angle = (Math.PI * 2 / numAxes) * j - Math.PI / 2;
      const scoreRatio = actualData[j] / totalQuestions;
      const currentScoreRadius = maxRadius * scoreRatio * progress;
      const x = centerX + Math.cos(angle) * currentScoreRadius;
      const y = centerY + Math.sin(angle) * currentScoreRadius;
      ctx.beginPath();
      ctx.arc(x, y, 4.5, 0, Math.PI * 2);
      ctx.fillStyle = '#f97316';
      ctx.fill();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }

    if (progress === 1) {
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 13px monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      for (let j = 0; j < numAxes; j++) {
        const angle = (Math.PI * 2 / numAxes) * j - Math.PI / 2;
        const labelX = centerX + Math.cos(angle) * (maxRadius + 20);
        const labelY = centerY + Math.sin(angle) * (maxRadius + 20);
        ctx.fillText(labels[j], labelX, labelY);
      }
      triggerLightConfetti();
    } else {
      requestAnimationFrame(drawFrame);
    }
  }

  requestAnimationFrame(drawFrame);
}

// ═══════════════════════════════════════════════
//  Confetti
// ═══════════════════════════════════════════════
function triggerLightConfetti() {
  if (typeof confetti !== 'function') return;
  confetti({
    particleCount: 40,
    spread: 60,
    origin: { y: 0.7 },
    colors: ['#8b5cf6', '#f97316', '#3b82f6', '#10b981']
  });
}

// ═══════════════════════════════════════════════
//  Restart & Boot
// ═══════════════════════════════════════════════
function restartGame() {
  locked = true;
  clearInterval(timer);
  initGame();
  locked = false;
}

initGame();
</script>
