<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>hex.coach — 六维对话竞技</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: 'Inter', sans-serif;
      background: #08080e;
      color: #e2e8f0;
      display: flex;
      flex-direction: column;
    }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #2a2a4a; border-radius: 2px; }

    /* ─── Header ─────────────────────────────── */
    #header {
      flex-shrink: 0;
      padding: 0.7rem 1rem;
      background: rgba(10,10,18,0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid #1e1e3a;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      z-index: 20;
    }
    .header-logo {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 800;
      font-size: 1.1rem;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .header-progress {
      font-size: 0.7rem;
      color: #475569;
      margin-left: auto;
    }

    /* ─── Result header row (hidden by default) ─── */
    #resultHeaderRow {
      display: none;
      flex-shrink: 0;
      padding: 0.5rem 1rem;
      background: rgba(10,10,18,0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid #1e1e3a;
      align-items: center;
      gap: 0.6rem;
      z-index: 20;
    }
    #resultHeaderRow .power {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.88rem;
      font-weight: 700;
      color: #a78bfa;
      white-space: nowrap;
    }
    #resultHeaderRow .badge-wrap {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    #resultHeaderRow .medal {
      font-size: 1.2rem;
    }
    #resultHeaderRow .rank-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.88rem;
      font-weight: 700;
      background: linear-gradient(135deg, #a855f7, #f97316);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      white-space: nowrap;
    }

    /* ─── Chat container ─────────────────────── */
    #chatContainer {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 0.75rem 0.75rem 0.5rem;
      scroll-behavior: smooth;
    }
    #chatInner {
      max-width: 640px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    /* ─── Bubbles ────────────────────────────── */
    .bubble {
      max-width: 88%;
      border-radius: 1rem;
      padding: 0.7rem 0.9rem;
      font-size: 0.88rem;
      line-height: 1.55;
      animation: fadeUp 0.3s ease;
      word-break: break-word;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .bubble-ai {
      align-self: flex-start;
      background: linear-gradient(145deg, #1a1a2e, #16162a);
      border: 1px solid #2a2a4a;
      color: #e2e8f0;
      border-bottom-left-radius: 0.25rem;
    }
    .bubble-ai .author {
      font-size: 0.65rem;
      color: #6366f1;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.3rem;
      margin-bottom: 0.3rem;
    }
    .bubble-ai .author .avatar {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 20px; height: 20px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-radius: 50%;
      font-size: 0.6rem;
      color: #fff;
    }

    .bubble-user {
      align-self: flex-end;
      background: linear-gradient(135deg, #4f46e5, #6366f1);
      color: #fff;
      border-bottom-right-radius: 0.25rem;
    }

    /* ─── Inline option buttons ──────────────── */
    .option-group {
      align-self: flex-end;
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      justify-content: flex-end;
      max-width: 88%;
      animation: fadeUp 0.3s ease;
    }
    .opt-btn {
      flex: 0 0 auto;
      padding: 0.7rem 1rem;
      background: rgba(30,30,60,0.7);
      border: 1px solid #2e2e52;
      border-radius: 999px;
      color: #cbd5e1;
      font-size: 0.88rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      -webkit-tap-highlight-color: transparent;
      white-space: nowrap;
    }
    .opt-btn:active {
      animation: btnElastic 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes btnElastic {
      0%   { transform: scale(1); }
      25%  { transform: scale(0.93); }
      50%  { transform: scale(1.06); }
      75%  { transform: scale(0.97); }
      100% { transform: scale(1); }
    }
    .opt-btn:hover:not(.disabled) {
      background: rgba(99,102,241,0.15);
      border-color: #6366f1;
      color: #e2e8f0;
    }
    .opt-btn.correct {
      background: rgba(34,197,94,0.18);
      border-color: #22c55e;
      color: #86efac;
    }
    .opt-btn.wrong {
      background: rgba(239,68,68,0.18);
      border-color: #ef4444;
      color: #fca5a5;
    }
    .opt-btn.disabled { cursor: default; opacity: 0.6; }

    /* ─── GO! inline ─────────────────────────── */
    .go-inline {
      align-self: flex-end;
      padding: 0.7rem 2.2rem;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border: none;
      border-radius: 999px;
      color: #fff;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s;
      -webkit-tap-highlight-color: transparent;
    }
    .go-inline:active { transform: scale(0.94); }
    .go-inline.disabled { opacity: 0.4; cursor: default; transform: none; }

    /* ─── Fixed bottom timer bar ─────────────── */
    #bottomTimer {
      flex-shrink: 0;
      height: 3px;
      background: #1e1e3a;
      z-index: 30;
    }
    #timerFill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #6366f1, #a855f7);
      transition: width 0.1s linear;
    }
    #timerFill.warning { background: linear-gradient(90deg, #f59e0b, #ef4444); }

    /* ─── Typing dots ────────────────────────── */
    .typing-dots {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.3rem 0.1rem;
    }
    .typing-dots span {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #6366f1;
      animation: dotPulse 1.2s infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes dotPulse {
      0%,60%,100% { opacity: 0.3; transform: scale(1); }
      30% { opacity: 1; transform: scale(1.3); }
    }

    /* ─── Result card ────────────────────────── */
    .result-card {
      background: linear-gradient(145deg, #13131f, #1a1a2e);
      border: 1px solid #2a2a4a;
      border-radius: 1rem;
      padding: 1.2rem;
      margin-top: 0.3rem;
    }
    .rank-display {
      font-family: 'JetBrains Mono', monospace;
      font-size: 2rem;
      font-weight: 800;
      text-align: center;
      background: linear-gradient(135deg, #a855f7, #f97316);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.3;
    }
    .rank-sub {
      text-align: center;
      font-size: 0.75rem;
      color: #64748b;
      margin-bottom: 0.4rem;
    }
    .title-display {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      font-weight: 600;
      text-align: center;
      color: #c4b5fd;
      margin-bottom: 0.3rem;
      line-height: 1.4;
    }
    .restart-btn {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      width: 100%;
      padding: 0.75rem;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border: none;
      border-radius: 0.7rem;
      color: #fff;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s;
    }
    .restart-btn:active { transform: scale(0.97); }

    /* ─── Scroll Snap Card Container ─────────── */
    .snap-scroll {
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      width: 100%;
      padding: 0.5rem 0;
    }
    .snap-scroll::-webkit-scrollbar { display: none; }
    .snap-scroll { -ms-overflow-style: none; scrollbar-width: none; }
    .snap-card {
      width: 100%;
      flex-shrink: 0;
      scroll-snap-align: center;
      padding: 0 0.25rem;
    }
    .snap-card-inner {
      background: rgba(30,30,60,0.6);
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 0.75rem;
      padding: 1rem 1rem;
    }
    .snap-card-header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }
    .snap-card-header .dim-emoji { font-size: 1.2rem; }
    .snap-card-header .dim-name {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: 0.9rem;
      color: #c4b5fd;
    }
    .snap-card-header .dim-score {
      margin-left: auto;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      color: #64748b;
    }
    .snap-card-text {
      font-size: 0.82rem;
      line-height: 1.65;
      color: #94a3b8;
    }

    /* ─── Dot indicators ─────────────────────── */
    .dots-wrap {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      margin-top: 0.4rem;
      margin-bottom: 0.6rem;
    }
    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #475569;
      transition: all 0.25s ease;
    }
    .dot.active {
      background: #a78bfa;
      box-shadow: 0 0 6px rgba(167, 139, 250, 0.6);
    }

    /* ─── Empty spacer for scroll anchor ─────── */
    #scrollAnchor { height: 1px; flex-shrink: 0; }
  </style>
</head>
<body>

<!-- ─── Header ─────────────────────────────── -->
<div id="header">
  <span class="header-logo">hex.coach</span>
  <span style="font-size:0.7rem;color:#475569;">六维对话竞技</span>
  <span class="header-progress" id="headerProgress"></span>
</div>

<!-- ─── Result Header Row (shown when game ends) ─ -->
<div id="resultHeaderRow">
  <span class="power" id="resultPower">⚔️ 总战力：0</span>
  <div class="badge-wrap">
    <span class="medal" id="resultMedal">🥉</span>
    <span class="rank-badge" id="resultRankBadge">—</span>
  </div>
</div>

<!-- ─── Chat (scrollable) ──────────────────── -->
<div id="chatContainer">
  <div id="chatInner"></div>
  <div id="scrollAnchor"></div>
</div>

<!-- ─── Fixed bottom timer bar ────────────── -->
<div id="bottomTimer"><div id="timerFill"></div></div>

<script>
// ═══════════════════════════════════════════════
//  Embedded quiz data (90 questions, 6 dimensions)
// ═══════════════════════════════════════════════
const QUIZ_DATA = {"dimensions":[{"name":"深海","emoji":"🌊","questions":[{"id":"deep_01","question":"马里亚纳海沟最深处（挑战者深渊）的水压约为海平面大气压的多少倍？","options":["约 110 倍","约 550 倍","约 1100 倍","约 5500 倍"],"answer":2,"explanation":"深度约 11,000 米，每 10 米增 1 个大气压，故约 1,100 倍。这相当于 50 架波音 747 叠在你脚上。"},{"id":"deep_02","question":"哪种深海生物能发出红光，且是已知唯一能看到红光并以此狩猎的鱼类？","options":["鮟鱇鱼","黑龙鱼","水母","深海鳕鱼"],"answer":1,"explanation":"黑龙鱼（Malacosteus）可发射远红光并用叶绿素衍生物感知它。多数深海鱼只看蓝光，而黑龙鱼拥有自己的夜视仪。"},{"id":"deep_03","question":"深海热泉（Hydrothermal Vent）生态系统的能量来源是什么？","options":["太阳光","地热与化学合成","海底火山岩浆","放射性衰变"],"answer":1,"explanation":"深海热泉依赖化能合成细菌将 H₂S 和 CO₂ 转化为有机物，完全不依赖光合作用——这是地球上独立于太阳的第二生物圈。"},{"id":"deep_04","question":"抹香鲸能下潜到约 2,000 米深处捕食大王乌贼，它的哪个器官帮助应对巨大水压？","options":["巨大的肺","头部的鲸蜡油","厚达 30 厘米的脂肪层","可塌缩的肋骨"],"answer":1,"explanation":"抹香鲸头部的鲸蜡油（Spermaceti）可在深潜时冷却凝固（密度变大），帮助浮力调节且保护脑部不被压扁，鲸蜡油也因此得名。"},{"id":"deep_05","question":"目前已知最深的活鱼记录是在什么深度发现的？","options":["约 4,000 米","约 5,800 米","约 8,300 米","约 10,900 米"],"answer":2,"explanation":"2014 年在马里亚纳海沟 8,143 米处发现狮子鱼（Pseudoliparis swirei）。2017 年日本深海科考又在 8,178 米拍到了同类。"}]},{"name":"星空","emoji":"⭐","questions":[{"id":"star_01","question":"一个秒差距（Parsec）大约相当于多少光年？","options":["1.5 光年","3.26 光年","5.88 光年","10.5 光年"],"answer":1,"explanation":"1 pc ≈ 3.2616 ly。定义：当天文单位（1 AU）对应 1 角秒的视差时，观测者与目标之间的距离。千年隼号跑完 Kessel 跑道的 12 pc 就是《星球大战》经典梗。"},{"id":"star_02","question":"中子星上一茶匙的物质在地球上大约有多重？","options":["10 吨","100 吨","1,000 万吨","10 亿吨"],"answer":3,"explanation":"中子星密度约 4×10¹⁷ kg/m³，一茶匙（5 mL）质量约 20 亿吨。这相当于将所有人类压缩到方糖大小。"},{"id":"star_03","question":"银河系中心超大质量黑洞的名称和最近确认的新闻是什么？","options":["M87*，2019 年首张照片","Sagittarius A*，2022 年事件视界望远镜发布照片","TON 618，被发现是宇宙最大黑洞","Cygnus X-1，2021 年质量更新"],"answer":1,"explanation":"人马座 A*（Sgr A*），质量约 400 万倍太阳。EHT 在 2022 年 5 月发布了其照片，距 M87* 首照三年后，证实了其存在。"},{"id":"star_04","question":"宇宙微波背景辐射（CMB）的温度大约是多少？","options":["零下 200°C","2.725 K","10 K","0 K"],"answer":1,"explanation":"CMB 是宇宙大爆炸约 38 万年后的余晖，当前温度 2.725 K（约 -270.4°C），是宇宙最完美的黑体辐射谱，精确度达 10⁻⁵。"},{"id":"star_05","question":"科学家发现的最快轨道速度的系外行星有多快？什么原因？","options":["约 1,000 km/s，双星引力弹弓","约 480 km/s，被恒星潮汐剥离","约 200 km/s，超大质量黑洞抛射","约 50 km/s，普通恒星引力"],"answer":0,"explanation":"Swift J1756.9-2508 系统的行星以约 1,000 km/s 绕中子星公转（地球仅 30 km/s）。如果它在太阳系，从地球到月球只需 6 分钟。"}]},{"name":"世界之最","emoji":"🏆","questions":[{"id":"record_01","question":"地球上最长的不间断山脉是哪座？","options":["喜马拉雅山脉","安第斯山脉","大洋中脊","洛基山脉"],"answer":2,"explanation":"大洋中脊（Mid-Ocean Ridge）全长约 65,000 公里，是地球上最长山脉，几乎全部在水下。安第斯才 7,000 公里，不及它十分之一。"},{"id":"record_02","question":"人类已知的最短命的大型动物是什么？","options":["蜉蝣","灯蛾毛虫","侏儒虾虎鱼","雄性蜂鸟"],"answer":2,"explanation":"侏儒虾虎鱼（Eviota sigillata）之寿命仅 59 天，为脊椎动物最短。蜉蝣幼虫可活数年，只是成虫仅活数小时——总寿命远长于虾虎鱼。"},{"id":"record_03","question":"宇宙中已知最明亮的类星体是哪个？","options":["3C 273","S5 0014+81","SMSS J2157-3602","TON 618"],"answer":3,"explanation":"TON 618 光度高达 4×10⁴¹ 瓦，相当于 140 万亿个太阳，是已知最亮类星体。其中心黑洞约 660 亿倍太阳质量，也是已知最大黑洞。"},{"id":"record_04","question":"地球上最干燥（降水量最少）的地方是哪里？","options":["撒哈拉沙漠","南极干谷","阿塔卡马沙漠","戈壁沙漠"],"answer":2,"explanation":"智利阿塔卡马沙漠的亚里卡（Arica）年均降水 0.5 mm，但南极麦克默多干谷已数百万年无降水，是地球上最干燥的地方。"},{"id":"record_05","question":"人类飞行到达的最远人造物体是？距离多远？","options":["旅行者 1号，约 240 亿公里","新视野号，约 80 亿公里","先驱者 10号，约 120 亿公里","旅行者 2号，约 200 亿公里"],"answer":0,"explanation":"旅行者 1号（1977 年发射）截至 2024 年距地约 162 AU（240 亿公里），是唯一进入星际空间的人造物。它的信号以光速需 22.5 小时才能到达地球。"}]},{"name":"古文明","emoji":"🏛️","questions":[{"id":"ancient_01","question":"已知最古老的法典是哪一部？","options":["汉谟拉比法典","乌尔纳姆法典","十二铜表法","摩奴法典"],"answer":1,"explanation":"《乌尔纳姆法典》（约公元前 2100 年）比汉谟拉比早了约 300 年，由苏美尔乌尔第三王朝创立。其中已有罚金代替肉刑的规定——相当超前。"},{"id":"ancient_02","question":"古埃及人建造金字塔时使用的铜制工具最缺乏哪种性能？","options":["硬度","韧性","抗腐蚀性","密度"],"answer":0,"explanation":"自然界铜的硬度（莫氏 3）远低于花岗岩（莫氏 7）。古埃及人用铜锯加石英砂岩磨削花岗岩，一块巨石需数百人数周时间。没铁器才如此耗时。"},{"id":"ancient_03","question":"特洛伊古城真正的地理位置（根据考古学）在哪里？","options":["希腊雅典附近","土耳其希萨利克","意大利西西里","埃及亚历山大"],"answer":1,"explanation":"1870 年海因里希·施利曼在土耳其西北的希萨利克（Hisarlik）发掘出 9 层特洛伊遗址。特洛伊 VII 层（约前 1300 年）被认为是荷马史诗中的特洛伊。"},{"id":"ancient_04","question":"玛雅数字系统中 tion":"标准自注意力的复杂度为 O(n²·d)，n 为序列长度。每个 token 都要与所有其他 token 计算 attention score，这使得长文本处理极其昂贵。"},{"id":"ai_03","question":"AI 对齐（AI Alignment）的核心目标是什么？","options":["让 AI 的输出与数学公式对齐","确保 AI 系统的目标和价值观符合人类意图","让多个 AI 模型有相同的参数量","让 AI 生成的内容符合语法规则"],"answer":1,"explanation":"AI 对齐是指确保 AI 系统追求的目标与人类的真实意图和价值观一致。RLHF（基于人类反馈的强化学习）是目前最主流的对齐技术。"},{"id":"ai_04","question":"GPT-4 的上下文窗口（Context Window）大小在早期版本中最大是多少？","options":["2,048 tokens","8,192 tokens","32,768 tokens","128,000 tokens"],"answer":2,"explanation":"GPT-4 最初发布时支持 8K 和 32K 两个版本。2024 年 GPT-4 Turbo 扩展到 128K。作为对比，BERT 仅为 512 tokens——三年增长了 256 倍。"},{"id":"ai_05","question":"机器学习中过拟合（Overfitting）的典型表现是什么？","options":["训练集和测试集准确率都很高","训练集准确率很高，测试集准确率很低","训练集和测试集准确率都很低","模型参数量过大"],"answer":1,"explanation":"过拟合指模型在训练数据上表现完美（甚至记住噪声），但在未见数据上泛化能力差——相当于考试背答案而非理解知识。Dropout、正则化、早停法是常用缓解手段。"}]}]};

// ─── Helpers ────────────────────────────────
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
function pickRandom(arr, n) {
  const copy = [...arr]; shuffle(copy); return copy.slice(0, n);
}
function scrollBottom() {
  requestAnimationFrame(() => anchor.scrollIntoView({ behavior: 'smooth' }));
}
function getInterpTier(score) {
  if (score <= 1) return 'low';
  if (score <= 3) return 'mid';
  return 'high';
}
function rankConfig(power) {
  if (power <= 2000) return { name: '初始白客', sub: '初入战场，数据流尚在摸索', medal: '🥉' };

  return { name: '超维主宰', sub: '全方位无短板，已逼近全能战士', medal: '🥇' };

// ─── Build quiz ─────────────────────────────
function buildQuiz() {
  quiz = [];
  dimensionResults = {};
  for (const dim of QUIZ_DATA.dimensions) {
    const picked = pickRandom(dim.questions, 4);
    for (const q of picked) {
      quiz.push({ ...q, dimensionName: dim.name, dimensionEmoji: dim.emoji });
    }
    dimensionResults[dim.name] = { correct: 0, total: 4, emoji: dim.emoji };
  }
  shuffle(quiz);
}

// ─── Timer control ─────────────────────────
function startTimer() {
  clearInterval(timer);
  timerFill.style.width = '100%';
  timerFill.classList.remove('warning');
  const start = Date.now();
  const dur = 15 * 1000;
  timer = setInterval(() => {
    const elapsed = Date.now() - start;
    const remain = Math.max(0, dur - elapsed);
    const pct = (remain / dur) * 100;
    timerFill.style.width = pct + '%';
    timerFill.classList.toggle('warning', pct < 35);
    if (remain <= 0) {
      clearInterval(timer);
      if (!locked) handleTimeout();
    }
  }, 50);
}

function stopTimer() {
  clearInterval(timer);
  timerFill.style.width = '0%';
}

// ═══════════════════════════════════════════════
//  PHASE 1: Init → "准备好了吗？" + GO! inline
// ═══════════════════════════════════════════════
function initGame() {
  correctCount = 0;
  streakCount = 0;
  currentIndex = 0;
  initialGo = true;
  buildQuiz();
  chatInner.innerHTML = '';
  stopTimer();
  resultHeaderRow.style.display = 'none';
  headerProgress.textContent = `0/${quiz.length}`;

  addAiBubble(`
    <div style="font-weight:700;margin-bottom:0.25rem;">🧪 hex.coach 已上线</div>
    <div style="color:#94a3b8;font-size:0.82rem;line-height:1.6;">
      从六个维度随机抽题轰炸你的大脑。<br>
      准备好了吗？
    </div>
  `);

  const go = document.createElement('button');
  go.className = 'go-inline';
  go.id = 'goBtn';
  go.textContent = 'GO!';
  go.addEventListener('click', () => handleGo(go));
  chatInner.appendChild(go);
  scrollBottom();
}

// ═══════════════════════════════════════════════
//  PHASE 2: GO!
// ═══════════════════════════════════════════════
function handleGo(goBtn) {
  if (locked || !initialGo) return;
  locked = true;
  initialGo = false;
  goBtn.classList.add('disabled');
  goBtn.style.pointerEvents = 'none';
  addUserBubble(goBtn.textContent);
  addTypingBubble();
  setTimeout(() => {
    removeTyping();
    askQuestion();
  }, 600);
}

// ═══════════════════════════════════════════════
//  PHASE 3: Question
// ═══════════════════════════════════════════════
function askQuestion() {
  if (currentIndex >= quiz.length) { showResult(); return; }
  const q = quiz[currentIndex];
  headerProgress.textContent = `${currentIndex + 1}/${quiz.length}`;
  addAiBubble(`
    <div style="font-size:0.7rem;color:#818cf8;margin-bottom:0.3rem;">${q.dimensionEmoji} ${q.dimensionName}</div>
    <div style="font-weight:600;">${q.question}</div>
  `);
  const group = document.createElement('div');
  group.className = 'option-group';
  group.id = 'optionGroup';
  q.options.forEach((opt) => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.textContent = opt;
    btn.addEventListener('click', () => handleAnswer(opt, btn));
    group.appendChild(btn);
  });
  chatInner.appendChild(group);
  scrollBottom();
  startTimer();
  locked = false;
}

// ═══════════════════════════════════════════════
//  PHASE 4a: Answer
// ═══════════════════════════════════════════════
function handleAnswer(optionText, clickedBtn) {
  if (locked) return;
  locked = true;
  stopTimer();
  const q = quiz[currentIndex];
  const isCorrect = optionText === q.options[q.answer];
  const og = document.getElementById('optionGroup');
  if (og) og.remove();
  addUserBubble(optionText);
  let streakMsg = '';
  if (isCorrect) {
    correctCount++;
    streakCount++;
    dimensionResults[q.dimensionName].correct++;
    if (streakCount === 3) {
      streakMsg = '<div style="font-size:0.85rem;margin-top:0.25rem;color:#f97316;">🔥 连击！脑力全开！</div>';
    } else if (streakCount === 7) {
      streakMsg = '<div style="font-size:0.85rem;margin-top:0.25rem;color:#f97316;">⚡ 超频模式！神挡杀神！</div>';
    } else if (streakCount === 10) {
      streakMsg = '<div style="font-size:0.85rem;margin-top:0.25rem;color:#f97316;">👑 满血通关！人类智慧巅峰！</div>';
    }
  } else {
    streakCount = 0;
  }
  addTypingBubble();
  setTimeout(() => {
    removeTyping();
    const tone = isCorrect ? pick(PRAISE) : pick(BOO);
    addAiBubble(`
      <div style="font-weight:700;margin-bottom:0.25rem;">${isCorrect ? '✅' : '💡'} ${tone}</div>
      ${streakMsg}
      <div style="color:#818cf8;font-size:0.82rem;margin-bottom:0.3rem;">${q.options[q.answer]}</div>
      <div style="color:#94a3b8;font-size:0.8rem;line-height:1.6;">${q.explanation}</div>
    `);
    currentIndex++;
    setTimeout(() => { askQuestion(); }, 1500);
  }, 700);
}

// ═══════════════════════════════════════════════
//  PHASE 4b: Timeout
// ═══════════════════════════════════════════════
function handleTimeout() {
  if (locked) return;
  locked = true;
  const q = quiz[currentIndex];
  document.querySelectorAll('.opt-btn').forEach((btn) => {
    btn.classList.add('disabled');
    if (btn.textContent === q.options[q.answer]) btn.classList.add('correct');
  });
  addAiBubble(`<div style="font-weight:700;margin-bottom:0.25rem;">⏰ ${pick(TIMEOUT_TEASE)}</div>`);
  locked = false;
  document.querySelectorAll('.opt-btn').forEach((btn) => {
    if (!btn.classList.contains('correct')) btn.classList.remove('disabled');
  });
  startTimer();
}

// ═══════════════════════════════════════════════
//  RESULT
// ═══════════════════════════════════════════════
function showResult() {
  stopTimer();
  headerProgress.textContent = '✓ 完成';

  const dimOrder = ['深海', '星空', '世界之最', '古文明', '智商测试', 'AI'];
  const dimData = dimOrder.map(name => dimensionResults[name] ? dimensionResults[name].correct : 0);
  const totalQuestions = dimensionResults[dimOrder[0]] ? dimensionResults[dimOrder[0]].total : 4;

  // ─── Compute rank & title ─────────────────────
  const totalPower = Math.round((correctCount / quiz.length) * 6000);
  const rc = rankConfig(totalPower);
  const rankName = rc.name;
  const rankSub = rc.sub;

  const titleMap = { '深海': '深渊铁壁', '星空': '幽灵星轨', '世界之最': '极境漫游者', '古文明': '黑盒考古客', '智商测试': '高维破译官', 'AI': '矩阵幽灵' };
  const dimScores = dimOrder.map(name => ({ name, score: dimensionResults[name] ? dimensionResults[name].correct : 0 }));
  const maxScore = Math.max(...dimScores.map(d => d.score));
  const topDims = dimScores.filter(d => d.score === maxScore).map(d => d.name);
  let titleText = '';
  if (topDims.length === 1) {
    titleText = `【${titleMap[topDims[0]]}】`;
  } else if (topDims.length === 2) {
    titleText = `${titleMap[topDims[0]]} · ${titleMap[topDims[1]]} 双核驱动`;
  } else if (topDims.length === 3) {
    titleText = `${topDims.map(d => titleMap[d]).join(' · ')} 三极共鸣`;
  } else {
    titleText = '万象均衡 · 全能基石';
  }

  // ─── Build swipeable interpretation cards ────
  let cardsHtml = '';
  for (const name of dimOrder) {
    const data = dimensionResults[name];
    if (!data) continue;
    const tier = getInterpTier(data.correct);
    const interp = DIM_INTERP[name] ? DIM_INTERP[name][tier] : '';
    const emoji = data.emoji;
    cardsHtml += `<div class="snap-card">
      <div class="snap-card-inner">
        <div class="snap-card-header">
          <span class="dim-emoji">${emoji}</span>
          <span class="dim-name">${name}</span>
          <span class="dim-score">${data.correct}/${data.total}</span>
        </div>
        <div class="snap-card-text">${interp}</div>
      </div>
    </div>`;
  }

  // ─── Dots HTML ─────────────────────────────
  let dotsHtml = '';
  for (let i = 0; i < dimOrder.length; i++) {
    dotsHtml += `<span class="dot${i === 0 ? ' active' : ''}" data-index="${i}"></span>`;
  }

  addAiBubble(`
    <div class="result-card">
      <div class="rank-display">${rankName}</div>
      <div class="rank-sub">${rankSub}</div>
      <div class="title-display">${titleText}</div>
      <div style="text-align:center;color:#64748b;font-size:0.75rem;margin-bottom:0.3rem;">战力总分 ${totalPower} / 6000</div>
      <div class="relative w-full max-w-[280px] mx-auto my-3 aspect-square">
        <canvas id="radarChart"></canvas>
      </div>

      <div class="snap-scroll" id="cardScroller">
        ${cardsHtml}
      </div>
      <div class="dots-wrap" id="cardDots">${dotsHtml}</div>

      <button class="restart-btn" onclick="restartGame()">[ 再来一次 ]</button>
    </div>
  `);

  // ─── Update result header ───────────────────
  resultPower.textContent = `⚔️ 总战力：${totalPower}`;
  resultMedal.textContent = rc.medal;
  resultRankBadge.textContent = rankName;
  resultHeaderRow.style.display = 'flex';

  // ─── Sync scroll snap dots ──────────────────
  const scroller = document.getElementById('cardScroller');
  const dotsContainer = document.getElementById('cardDots');
  if (scroller && dotsContainer) {
    scroller.addEventListener('scroll', () => {
      const idx = Math.round(scroller.scrollLeft / scroller.clientWidth);
      const dots = dotsContainer.querySelectorAll('.dot');
      dots.forEach((d, i) => d.classList.toggle('active', i === idx));
    });
  }

  // ─── Render Radar Chart ─────────────────────
  requestAnimationFrame(() => {
    const canvas = document.getElementById('radarChart');
    if (!canvas) return;
    animateRadarChart(canvas, dimData, totalQuestions);
  });
}

// ═══════════════════════════════════════════════
//  Radar Animation Engine
// ═══════════════════════════════════════════════
function animateRadarChart(canvas, actualData, totalQuestions = 4) {
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.parentElement.getBoundingClientRect();
  const size = Math.min(rect.width, rect.height);
  canvas.width = size * dpr;
  canvas.height = size * dpr;
  canvas.style.width = size + 'px';
  canvas.style.height = size + 'px';
  ctx.scale(dpr, dpr);

  const centerX = size / 2;
  const centerY = size / 2;
  const maxRadius = Math.min(centerX, centerY) - 50;

  const labels = ['深海', '星空', '世界之最', '古文明', '智商测试', 'AI'];
  const numAxes = labels.length;

  let startTime = null;
  const duration = 1500;

  function drawFrame(timestamp) {
    if (!startTime) startTime = timestamp;
    let progress = (timestamp - startTime) / duration;
    if (progress > 1) progress = 1;

    ctx.clearRect(0, 0, size, size);
    const currentMaxRadius = maxRadius * progress;

    for (let i = 1; i <= totalQuestions; i++) {
      const ringRadius = (currentMaxRadius / totalQuestions) * i;
      ctx.beginPath();
      for (let j = 0; j < numAxes; j++) {
        const angle = (Math.PI * 2 / numAxes) * j - Math.PI / 2;
        const x = centerX + Math.cos(angle) * ringRadius;
        const y = centerY + Math.sin(angle) * ringRadius;
        if (j === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.strokeStyle = `rgba(139, 92, 246, ${0.15 * progress})`;
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    ctx.beginPath();
    for (let j = 0; j < numAxes; j++) {
      const angle = (Math.PI * 2 / numAxes) * j - Math.PI / 2;
      ctx.moveTo(centerX, centerY);
      ctx.lineTo(centerX + Math.cos(angle) * currentMaxRadius, centerY + Math.sin(angle) * currentMaxRadius);
    }
    ctx.strokeStyle = `rgba(255, 255, 255, ${0.1 * progress})`;
    ctx.stroke();

    ctx.beginPath();
    for (let j = 0; j < numAxes; j++) {
      const angle = (Math.PI * 2 / numAxes) * j - Math.PI / 2;
      const scoreRatio = actualData[j] / totalQuestions;
      const currentScoreRadius = maxRadius * scoreRatio * progress;
      const x = centerX + Math.cos(angle) * currentScoreRadius;
      const y = centerY + Math.sin(angle) * currentScoreRadius;
      if (j === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.closePath();

    const fillGradient = ctx.createLinearGradient(0, 0, 0, size);
    fillGradient.addColorStop(0, `rgba(139, 92, 246, ${0.6 * progress})`);
    fillGradient.addColorStop(1, `rgba(249, 115, 22, ${0.15 * progress})`);
    ctx.fillStyle = fillGradient;
    ctx.fill();

    ctx.strokeStyle = `rgba(167, 139, 250, ${0.8 * progress})`;
    ctx.lineWidth = 2.5;
    ctx.stroke();

    for (let j = 0; j < numAxes; j++) {
      const angle = (Math.PI * 2 / numAxes) * j - Math.PI / 2;
      const scoreRatio = actualData[j] / totalQuestions;
      const currentScoreRadius = maxRadius * scoreRatio * progress;
      const x = centerX + Math.cos(angle) * currentScoreRadius;
      const y = centerY + Math.sin(angle) * currentScoreRadius;
      ctx.beginPath();
      ctx.arc(x, y, 4.5, 0, Math.PI * 2);
      ctx.fillStyle = '#f97316';
      ctx.fill();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }

    if (progress === 1) {
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 13px monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      for (let j = 0; j < numAxes; j++) {
        const angle = (Math.PI * 2 / numAxes) * j - Math.PI / 2;
        const labelX = centerX + Math.cos(angle) * (maxRadius + 20);
        const labelY = centerY + Math.sin(angle) * (maxRadius + 20);
        ctx.fillText(labels[j], labelX, labelY);
      }
      triggerLightConfetti();
    } else {
      requestAnimationFrame(drawFrame);
    }
  }

  requestAnimationFrame(drawFrame);
}

// ═══════════════════════════════════════════════
//  Confetti
// ═══════════════════════════════════════════════
function triggerLightConfetti() {
  if (typeof confetti !== 'function') return;
  confetti({
    particleCount: 40,
    spread: 60,
    origin: { y: 0.7 },
    colors: ['#8b5cf6', '#f97316', '#3b82f6', '#10b981']
  });
}

// ═══════════════════════════════════════════════
//  Restart & Boot
// ═══════════════════════════════════════════════
function restartGame() {
  locked = true;
  clearInterval(timer);
  initGame();
  locked = false;
}

initGame();
</script>
