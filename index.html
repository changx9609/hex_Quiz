<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>hex.coach — 6D Cognitive Arena</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script defer src="https://umami-production-922a.up.railway.app/script.js" data-website-id="39feeb44-ac0c-41a5-ba3c-fc0bff86d406"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: 'Inter', sans-serif;
      background: #08080e;
      color: #e2e8f0;
      display: flex;
      flex-direction: column;
    }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #2a2a4a; border-radius: 2px; }

    /* ─── Header ─────────────────────────────── */
    #header {
      flex-shrink: 0;
      padding: 0.7rem 1rem;
      background: rgba(10,10,18,0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid #1e1e3a;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      z-index: 20;
    }
    .header-logo {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 800;
      font-size: 1.1rem;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .header-progress {
      font-size: 0.7rem;
      color: #475569;
      margin-left: auto;
    }

    /* ─── Result header row (hidden by default) ─── */
    #resultHeaderRow {
      display: none;
      flex-shrink: 0;
      padding: 0.5rem 1rem;
      background: rgba(10,10,18,0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid #1e1e3a;
      align-items: center;
      gap: 0.6rem;
      z-index: 20;
    }
    #resultHeaderRow .power {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.88rem;
      font-weight: 700;
      color: #a78bfa;
      white-space: nowrap;
    }
    #resultHeaderRow .badge-wrap {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    #resultHeaderRow .medal {
      font-size: 1.2rem;
    }
    #resultHeaderRow .rank-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.88rem;
      font-weight: 700;
      background: linear-gradient(135deg, #a855f7, #f97316);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      white-space: nowrap;
    }

    /* ─── Chat container ─────────────────────── */
    #chatContainer {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 0.75rem 0.75rem 0.5rem;
      scroll-behavior: smooth;
    }
    #chatInner {
      max-width: 640px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    /* ─── Bubbles ────────────────────────────── */
    .bubble {
      max-width: 88%;
      border-radius: 1rem;
      padding: 0.7rem 0.9rem;
      font-size: 0.88rem;
      line-height: 1.55;
      animation: fadeUp 0.3s ease;
      word-break: break-word;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .bubble-ai {
      align-self: flex-start;
      background: linear-gradient(145deg, #1a1a2e, #16162a);
      border: 1px solid #2a2a4a;
      color: #e2e8f0;
      border-bottom-left-radius: 0.25rem;
    }
    .bubble-ai .author {
      font-size: 0.65rem;
      color: #6366f1;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.3rem;
      margin-bottom: 0.3rem;
    }
    .bubble-ai .author .avatar {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 20px; height: 20px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-radius: 50%;
      font-size: 0.6rem;
      color: #fff;
    }

    .bubble-user {
      align-self: flex-end;
      background: linear-gradient(135deg, #4f46e5, #6366f1);
      color: #fff;
      border-bottom-right-radius: 0.25rem;
    }

    /* ─── Inline option buttons ──────────────── */
    .option-group {
      align-self: flex-end;
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      justify-content: flex-end;
      max-width: 88%;
      animation: fadeUp 0.3s ease;
    }
    .opt-btn {
      flex: 0 1 auto;
      padding: 0.55rem 0.85rem;
      background: rgba(30,30,60,0.7);
      border: 1px solid #2e2e52;
      border-radius: 0.7rem;
      color: #cbd5e1;
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      -webkit-tap-highlight-color: transparent;
      white-space: normal;
      word-break: break-word;
      max-width: 100%;
      line-height: 1.4;
      text-align: left;
    }
    .opt-btn:active {
      animation: btnElastic 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes btnElastic {
      0%   { transform: scale(1); }
      25%  { transform: scale(0.93); }
      50%  { transform: scale(1.06); }
      75%  { transform: scale(0.97); }
      100% { transform: scale(1); }
    }
    .opt-btn:hover:not(.disabled) {
      background: rgba(99,102,241,0.15);
      border-color: #6366f1;
      color: #e2e8f0;
    }
    .opt-btn.correct {
      background: rgba(34,197,94,0.18);
      border-color: #22c55e;
      color: #86efac;
    }
    .opt-btn.wrong {
      background: rgba(239,68,68,0.18);
      border-color: #ef4444;
      color: #fca5a5;
    }
    .opt-btn.disabled { cursor: default; opacity: 0.6; }

    /* ─── GO! inline ─────────────────────────── */
    .go-inline {
      align-self: flex-end;
      padding: 0.7rem 2.2rem;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border: none;
      border-radius: 999px;
      color: #fff;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s;
      -webkit-tap-highlight-color: transparent;
    }
    .go-inline:active { transform: scale(0.94); }
    .go-inline.disabled { opacity: 0.4; cursor: default; transform: none; }

    /* ─── Fixed bottom timer bar ─────────────── */
    #bottomTimer {
      flex-shrink: 0;
      height: 3px;
      background: #1e1e3a;
      z-index: 30;
    }
    #timerFill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #6366f1, #a855f7);
      transition: width 0.1s linear;
    }
    #timerFill.warning { background: linear-gradient(90deg, #f59e0b, #ef4444); }

    /* ─── Typing dots ────────────────────────── */
    .typing-dots {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.3rem 0.1rem;
    }
    .typing-dots span {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #6366f1;
      animation: dotPulse 1.2s infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes dotPulse {
      0%,60%,100% { opacity: 0.3; transform: scale(1); }
      30% { opacity: 1; transform: scale(1.3); }
    }

    /* ─── Result card ────────────────────────── */
    .result-card {
      background: linear-gradient(145deg, #13131f, #1a1a2e);
      border: 1px solid #2a2a4a;
      border-radius: 1rem;
      padding: 1.2rem;
      margin-top: 0.3rem;
    }
    .rank-display {
      font-family: 'JetBrains Mono', monospace;
      font-size: 2rem;
      font-weight: 800;
      text-align: center;
      background: linear-gradient(135deg, #a855f7, #f97316);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.3;
    }
    .rank-sub {
      text-align: center;
      font-size: 0.75rem;
      color: #64748b;
      margin-bottom: 0.4rem;
    }
    .title-display {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      font-weight: 600;
      text-align: center;
      color: #c4b5fd;
      margin-bottom: 0.3rem;
      line-height: 1.4;
    }
    .restart-btn {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      flex: 1;
      padding: 0.65rem 1rem;
      background: rgba(30,30,60,0.6);
      border: 1px solid rgba(139, 92, 246, 0.35);
      border-radius: 0.7rem;
      color: #c4b5fd;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s;
      -webkit-tap-highlight-color: transparent;
    }
    .restart-btn:active { transform: scale(0.96); background: rgba(99,102,241,0.15); }

    /* ─── Scroll Snap Card Container ─────────── */
    .snap-scroll {
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      width: 100%;
      padding: 0.5rem 0;
    }
    .snap-scroll::-webkit-scrollbar { display: none; }
    .snap-scroll { -ms-overflow-style: none; scrollbar-width: none; }
    .snap-card {
      width: 100%;
      flex-shrink: 0;
      scroll-snap-align: center;
      padding: 0 0.25rem;
    }
    .snap-card-inner {
      background: rgba(30,30,60,0.6);
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 0.75rem;
      padding: 1rem 1rem;
    }
    .snap-card-header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }
    .snap-card-header .dim-emoji { font-size: 1.2rem; }
    .snap-card-header .dim-name {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: 0.9rem;
      color: #c4b5fd;
    }
    .snap-card-header .dim-score {
      margin-left: auto;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      color: #64748b;
    }
    .snap-card-text {
      font-size: 0.82rem;
      line-height: 1.65;
      color: #94a3b8;
    }

    /* ─── Dot indicators ─────────────────────── */
    .dots-wrap {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      margin-top: 0.4rem;
      margin-bottom: 0.6rem;
    }
    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #475569;
      transition: all 0.25s ease;
    }
    .dot.active {
      background: #a78bfa;
      box-shadow: 0 0 6px rgba(167, 139, 250, 0.6);
    }

    /* ─── Empty spacer for scroll anchor ─────── */
    #scrollAnchor { height: 1px; flex-shrink: 0; }

    /* ─── Share Card (screenshot target) ─────── */
    #shareCard {
      background: linear-gradient(145deg, #13131f, #1a1a2e);
      border: 1px solid #2a2a4a;
      border-radius: 1rem;
      padding: 1.2rem;
    }

    /* ─── Golden Quote (top-dimension highlight) ─ */
    .golden-quote {
      position: relative;
      background: rgba(139, 92, 246, 0.08);
      border: 1px solid rgba(139, 92, 246, 0.25);
      border-radius: 0.75rem;
      padding: 0.8rem 1rem;
      margin-top: 0.6rem;
    }
    .golden-quote::before {
      content: '';
      position: absolute;
      top: 0;
      left: 20%;
      right: 20%;
      height: 2.5px;
      background: linear-gradient(90deg, transparent, #a855f7, #f97316, transparent);
      border-radius: 2px;
    }
    .golden-quote .gq-header {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      font-weight: 700;
      color: #f97316;
      margin-bottom: 0.35rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .golden-quote .gq-text {
      font-size: 0.82rem;
      line-height: 1.6;
      color: #e2e8f0;
    }

    /* ─── Watermark ──────────────────────────── */
    .watermark {
      font-size: 0.85rem;
      color: #94a3b8;
      text-align: center;
      padding-top: 0.8rem;
      padding-bottom: 0.4rem;
      letter-spacing: 0.5px;
      font-family: 'JetBrains Mono', monospace;
    }
    .wm-hex {
      background: linear-gradient(135deg, #6366f1, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 700;
      font-size: 0.9rem;
    }
    .wm-combat {
      background: linear-gradient(135deg, #a855f7, #f97316);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 600;
      font-size: 0.75rem;
    }

    /* ─── Product Hunt badge ─────────────────── */
    .ph-badge-wrap {
      display: flex;
      justify-content: flex-start;
      margin-top: 0.4rem;
    }
    .ph-badge-wrap img {
      width: 140px;
      height: auto;
    }

    /* ─── Button row (outside shareCard) ─────── */
    .btn-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.6rem;
      margin-top: 0.6rem;
    }
    .btn-row .restart-btn {
      width: auto;
      flex: 1;
      padding: 0.65rem 1rem;
    }
    .btn-row .screenshot-btn {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      flex: 1;
      padding: 0.65rem 1rem;
      background: rgba(30,30,60,0.6);
      border: 1px solid rgba(139, 92, 246, 0.35);
      border-radius: 0.7rem;
      color: #c4b5fd;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-row .screenshot-btn:active {
      transform: scale(0.96);
      background: rgba(99,102,241,0.15);
    }
    .btn-row .screenshot-btn:disabled {
      opacity: 0.5;
      cursor: default;
      transform: none;
    }

    /* ─── Discord neon CTA ───────────────────── */
    .discord-cta-wrap {
      display: flex;
      justify-content: center;
      margin-top: 0.65rem;
    }
    .discord-cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: 0.72rem;
      padding: 0.6rem 1.2rem;
      background: rgba(30,30,60,0.6);
      border: 1px solid rgba(168,85,247,0.5);
      border-radius: 0.7rem;
      color: #c4b5fd;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.25s;
      -webkit-tap-highlight-color: transparent;
      box-shadow: 0 0 10px rgba(168,85,247,0.15);
      letter-spacing: 0.5px;
    }
    .discord-cta:hover {
      border-color: #a855f7;
      color: #fff;
      box-shadow: 0 0 20px rgba(168,85,247,0.4), 0 0 40px rgba(168,85,247,0.2);
      background: rgba(60,30,80,0.5);
      transform: scale(1.03);
    }
    .discord-cta:active {
      transform: scale(0.97);
      box-shadow: 0 0 8px rgba(168,85,247,0.3);
    }
    .discord-cta .cta-text {
      background: linear-gradient(135deg, #c084fc, #f97316);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* ─── Canvas parent fix for screenshots ──── */
    #shareCard .relative {
      position: relative;
      width: 100%;
      max-width: 280px;
      margin: 0.75rem auto;
    }
    #shareCard .relative canvas {
      display: block;
      width: 100%;
      height: auto;
    }
  </style>
</head>
<body>

<!-- ─── Header ─────────────────────────────── -->
<div id="header">
  <span class="header-logo">hex.coach</span>
  <span style="font-size:0.7rem;color:#475569;">6D Cognitive Arena</span>
  <span class="header-progress" id="headerProgress"></span>
</div>

<!-- ─── Privacy link (barely visible hacker-style) ─ -->
<div class="fixed top-4 right-4 z-50 font-mono text-[10px] opacity-30 hover:opacity-80 transition-opacity duration-300">
  <a href="/privacy.html" class="text-gray-600/40 decoration-dotted underline-offset-2 hover:text-gray-500 hover:underline">[PRIVACY ]</a>
</div>

<!-- ─── Result Header Row (shown when game ends) ─ -->
<div id="resultHeaderRow">
  <span class="power" id="resultPower">⚔️ NET POWER: 0</span>
  <div class="badge-wrap">
    <span class="medal" id="resultMedal">🥉</span>
    <span class="rank-badge" id="resultRankBadge">—</span>
  </div>
</div>

<!-- ─── Chat (scrollable) ──────────────────── -->
<div id="chatContainer">
  <div id="chatInner"></div>
  <div id="scrollAnchor"></div>
</div>

<!-- ─── Fixed bottom timer bar ────────────── -->
<div id="bottomTimer"><div id="timerFill"></div></div>

<script>
// ═══════════════════════════════════════════════
//  Data loading — fetched from Cloudflare R2 via Worker API.
//  Single source of truth: quiz_data.json & dimension_interpretations.json in R2 bucket.
// ═══════════════════════════════════════════════

// ─── Worker API base URL ──────────────────────────
// Quiz data fetched from Worker (public endpoints never expose answers).
const API_BASE = 'https://hex-arena-api.changx9609.workers.dev';

// ─── Dynamic data containers ──────────────────────
let QUIZ_DATA = null;
let DIM_INTERP = null;

async function loadData() {
  const [data, interp] = await Promise.all([
    fetch(`${API_BASE}/questions`).then(r => { if (!r.ok) throw new Error(`questions: ${r.status}`); return r.json(); }),
    fetch(`${API_BASE}/interpretations`).then(r => { if (!r.ok) throw new Error(`interpretations: ${r.status}`); return r.json(); })
  ]);

  QUIZ_DATA = data;
  DIM_INTERP = interp;
}

// ─── Tone pools ──────────────────────────────
const PRAISE = ['GENIUS!', 'FLAWLESS!', 'ROCK SOLID!', 'BRAIN OVERCLOCKED!'];
const BOO = ['ALMOST!', 'ALERT!', 'CORE LOST!', 'CPU MELTDOWN?'];
const TIMEOUT_TEASE = [
  'Agent, are you still online?',
  'Left your neural-link at the charging dock?',
  'Connection lost or CPU fried, operator?',
  'Hello? Any carbon unit still active?',
  'Tick tock... shall I grab a coffee while you decide? ☕'
];
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

// ─── Dimension label map for UI display ──────
const DIM_LABELS = {
  'DEEP_SEA': 'DEEP SEA',
  'COSMOS': 'COSMOS',
  'EX_RECORDS': 'WORLD RECORDS',
  'CIVILIZATION': 'ANCIENT CIV',
  'IQ_MATRIX': 'IQ MATRIX',
  'AI_CORE': 'AI CORE',
  'CHAOS': 'CHAOS'
};

// ─── State ───────────────────────────────────
let quiz = [];
let currentIndex = 0;
let correctCount = 0;
let streakCount = 0;
let dimensionResults = {};
let timer = null;
let locked = false;
let initialGo = true;
let selectedDimNames = [];
let timeoutCount = 0;

// ─── DOM refs ────────────────────────────────
const chatInner = document.getElementById('chatInner');
const headerProgress = document.getElementById('headerProgress');
const anchor = document.getElementById('scrollAnchor');
const timerFill = document.getElementById('timerFill');
const resultHeaderRow = document.getElementById('resultHeaderRow');
const resultPower = document.getElementById('resultPower');
const resultMedal = document.getElementById('resultMedal');
const resultRankBadge = document.getElementById('resultRankBadge');

// ─── Helpers ────────────────────────────────
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
function pickRandom(arr, n) {
  const copy = [...arr]; shuffle(copy); return copy.slice(0, n);
}
function scrollBottom() {
  requestAnimationFrame(() => anchor.scrollIntoView({ behavior: 'smooth' }));
}
function getInterpTier(score) {
  if (score <= 1) return 'low';
  if (score <= 3) return 'mid';
  return 'high';
}
function rankConfig(power) {
  if (power <= 2000) return { name: 'NEO WHITEHAT', sub: 'Fresh on the grid. Data streams still calibrating.', medal: '🥉' };
  if (power <= 4000) return { name: 'FISSION WALKER', sub: 'System-wide awareness online. Steady ascent underway.', medal: '🥈' };
  return { name: 'OMNI OVERLORD', sub: 'Zero blind spots. Approaching full-spectrum combat readiness.', medal: '🥇' };
}

// ─── Bubble builders ───────────────────────
function addAiBubble(html) {
  const div = document.createElement('div');
  div.className = 'bubble bubble-ai';
  div.innerHTML = `<div class="author"><span class="avatar">🤖</span> hex.coach</div>${html}`;
  chatInner.appendChild(div);
  scrollBottom();
}

function addUserBubble(text) {
  const div = document.createElement('div');
  div.className = 'bubble bubble-user';
  div.textContent = text;
  chatInner.appendChild(div);
  scrollBottom();
}

function addTypingBubble() {
  const div = document.createElement('div');
  div.className = 'bubble bubble-ai';
  div.id = 'typingBubble';
  div.innerHTML = `<div class="author"><span class="avatar">🤖</span> hex.coach</div><div class="typing-dots"><span></span><span></span><span></span></div>`;
  chatInner.appendChild(div);
  scrollBottom();
}

function removeTyping() {
  const tb = document.getElementById('typingBubble');
  if (tb) tb.remove();
}

// ─── Build quiz ─────────────────────────────
function buildQuiz() {
  quiz = [];
  dimensionResults = {};
  const chaosDim = QUIZ_DATA.dimensions.find(d => d.name === 'CHAOS');
  const otherDims = QUIZ_DATA.dimensions.filter(d => d.name !== 'CHAOS');
  const pickedDims = pickRandom(otherDims, 5);
  const activeDims = [chaosDim, ...pickedDims];
  selectedDimNames = activeDims.map(d => d.name);
  for (const dim of activeDims) {
    const picked = pickRandom(dim.questions, 4);
    for (const q of picked) {
      quiz.push({ ...q, dimensionName: dim.name, dimensionEmoji: dim.emoji });
    }
    dimensionResults[dim.name] = { correct: 0, total: 4, emoji: dim.emoji };
  }
  shuffle(quiz);
}

// ─── Timer control ─────────────────────────
function startTimer() {
  clearInterval(timer);
  timerFill.style.width = '100%';
  timerFill.classList.remove('warning');
  const start = Date.now();
  const dur = 15 * 1000;
  timer = setInterval(() => {
    const elapsed = Date.now() - start;
    const remain = Math.max(0, dur - elapsed);
    const pct = (remain / dur) * 100;
    timerFill.style.width = pct + '%';
    timerFill.classList.toggle('warning', pct < 35);
    if (remain <= 0) {
      clearInterval(timer);
      if (!locked) handleTimeout();
    }
  }, 50);
}

function stopTimer() {
  clearInterval(timer);
  timerFill.style.width = '0%';
}

// ═══════════════════════════════════════════════
//  PHASE 1: Init → "准备好了吗？" + GO! inline
// ═══════════════════════════════════════════════
function initGame() {
  correctCount = 0;
  streakCount = 0;
  currentIndex = 0;
  initialGo = true;
  buildQuiz();
  chatInner.innerHTML = '';
  stopTimer();
  resultHeaderRow.style.display = 'none';
  headerProgress.textContent = `0/${quiz.length}`;

  addAiBubble(`
    <div style="font-weight:700;margin-bottom:0.25rem;">🧪 hex.coach ONLINE</div>
    <div style="color:#94a3b8;font-size:0.82rem;line-height:1.6;">
      6 dimensions of tactical data incoming to blitz your cerebral core.<br>
      Are you calibrated?
    </div>
  `);

  const go = document.createElement('button');
  go.className = 'go-inline';
  go.id = 'goBtn';

  go.addEventListener('click', () => handleGo(go));

}

// ═══════════════════════════════════════════════
//  PHASE 2: GO!
// ═══════════════════════════════════════════════
function handleGo(goBtn) {
  if (locked || !initialGo) return;
  locked = true;
  initialGo = false;
  goBtn.classList.add('disabled');
  goBtn.style.pointerEvents = 'none';
  addUserBubble(goBtn.textContent);
  addTypingBubble();
  setTimeout(() => {
    removeTyping();
    askQuestion();
  }, 600);
}

// ═══════════════════════════════════════════════
//  PHASE 3: Question
// ═══════════════════════════════════════════════
function askQuestion() {
  timeoutCount = 0;
  if (currentIndex >= quiz.length) { showResult(); return; }
  const q = quiz[currentIndex];
  headerProgress.textContent = `${currentIndex + 1}/${quiz.length}`;
  addAiBubble(`
    <div style="font-size:0.7rem;color:#818cf8;margin-bottom:0.3rem;">${q.dimensionEmoji} ${DIM_LABELS[q.dimensionName] || q.dimensionName}</div>
    <div style="font-weight:600;">${q.question}</div>
  `);
  const group = document.createElement('div');
  group.className = 'option-group';
  group.id = 'optionGroup';
  q.options.forEach((opt) => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.textContent = opt;
    btn.addEventListener('click', () => handleAnswer(opt, btn));
    group.appendChild(btn);
  });
  chatInner.appendChild(group);
  scrollBottom();
  startTimer();
  locked = false;
}

// ═══════════════════════════════════════════════
//  PHASE 4a: Answer — validated server-side via Worker
// ═══════════════════════════════════════════════
function handleAnswer(optionText, clickedBtn) {
  if (locked) return;
  locked = true;
  stopTimer();
  try { umami.track('click-option'); } catch (_) {}
  const q = quiz[currentIndex];
  const og = document.getElementById('optionGroup');
  if (og) og.remove();
  addUserBubble(optionText);
  addTypingBubble();

  fetch(`${API_BASE}/validate`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ questionId: q.id, userAnswer: optionText })
  })
  .then(r => { if (!r.ok) return r.json().then(e => { throw new Error(e.error || 'validation failed') }); return r.json(); })
  .then(result => {
    removeTyping();
    const isCorrect = result.correct;
    const explanation = result.explanation;
    const correctAnswer = result.correctAnswer;
    let streakMsg = '';
    if (isCorrect) {
      correctCount++;
      streakCount++;
      dimensionResults[q.dimensionName].correct++;
      if (streakCount === 3) {
        streakMsg = '<div style="font-size:0.85rem;margin-top:0.25rem;color:#f97316;">🔥 COMBO! NEURAL CORES FULLY LEVERAGED!</div>';
      } else if (streakCount === 7) {
        streakMsg = '<div style="font-size:0.85rem;margin-top:0.25rem;color:#f97316;">⚡ OVERCLOCK MODE! CRUSHING THE MATRIX SYSTEM!</div>';
      } else if (streakCount === 10) {
        streakMsg = '<div style="font-size:0.85rem;margin-top:0.25rem;color:#f97316;">👑 FLAWLESS CLEAR! PEAK CARBON-BASED INTELLIGENCE!</div>';
      }
    } else {
      streakCount = 0;
    }
    if (result.isChaos) {
      addAiBubble(`<div style="color:#94a3b8;font-size:0.8rem;line-height:1.6;font-style:italic;">🔮 ${explanation}</div>`);
    } else {
      const tone = isCorrect ? pick(PRAISE) : pick(BOO);
      addAiBubble(`
        <div style="font-weight:700;margin-bottom:0.25rem;">${isCorrect ? '✅' : '💡'} ${tone}</div>
        ${streakMsg}
        <div style="color:#818cf8;font-size:0.82rem;margin-bottom:0.3rem;">${correctAnswer}</div>
        <div style="color:#94a3b8;font-size:0.8rem;line-height:1.6;">${explanation}</div>
      `);
    }
    currentIndex++;
    setTimeout(() => { askQuestion(); }, 1500);
  })
  .catch(err => {
    removeTyping();
    addAiBubble(`<div style="color:#ef4444;font-size:0.82rem;">⚠️ Validation error: ${err.message}</div>`);
    currentIndex++;
    setTimeout(() => { askQuestion(); }, 1500);
  });
}

// ═══════════════════════════════════════════════
//  PHASE 4b: Timeout — no answer exposed to frontend
// ═══════════════════════════════════════════════
function handleTimeout() {
  if (locked) return;
  locked = true;
  const q = quiz[currentIndex];
  const isChaos = q.dimensionName === 'CHAOS';
  timeoutCount++;
  if (timeoutCount === 1) {
    // First timeout: give another chance, NO correct answer highlighting
    addAiBubble(`<div style="font-weight:700;margin-bottom:0.25rem;">⏰ ${pick(TIMEOUT_TEASE)}</div>`);
    locked = false;
    startTimer();
  } else {
    // Second timeout: auto-skip to next question
    timeoutCount = 0;
    if (isChaos) {
      correctCount++;
      dimensionResults[q.dimensionName].correct++;
      streakCount++;
    } else {
      streakCount = 0;
    }
    const og = document.getElementById('optionGroup');
    if (og) og.remove();
    addAiBubble(`<div style="font-weight:700;margin-bottom:0.25rem;color:#64748b;">⏰ Connection terminated. Moving on...</div>`);
    currentIndex++;
    setTimeout(() => { askQuestion(); }, 1000);
  }
}

// ═══════════════════════════════════════════════
//  Screenshot & Share
// ═══════════════════════════════════════════════
function handleScreenshot() {
  const card = document.getElementById('shareCard');
  const btn = document.getElementById('screenshotBtn');
  if (!card) return;
  if (btn) btn.disabled = true;

  // ─── Patch gradient text before capture ───────
  // html2canvas doesn't render -webkit-background-clip:text (gradient text)
  // .rank-display is SVG (fully compatible), but watermark spans (.wm-hex/.wm-combat) and .gq-header need patching
  const rankEls = card.querySelectorAll('.gq-header, .wm-hex, .wm-combat');
  const patched = [];
  rankEls.forEach(el => {
    patched.push(el);
    // Save original inline styles
    el.dataset.patchFill = el.style.getPropertyValue('-webkit-text-fill-color') || '';
    el.dataset.patchBg = el.style.getPropertyValue('background') || '';
    el.dataset.patchClip = el.style.getPropertyValue('-webkit-background-clip') || '';
    el.dataset.patchColor = el.style.color || '';
    // Apply solid color patch
    el.style.setProperty('-webkit-text-fill-color', '#c4b5fd', 'important');
    el.style.setProperty('background', 'none', 'important');
    el.style.setProperty('-webkit-background-clip', 'unset', 'important');
  });

  html2canvas(card, {
    backgroundColor: null,
    scale: 3,
    useCORS: true,
    allowTaint: true,
    logging: false
  }).then(canvas => {
    // ─── Restore gradient text ────────────────
    patched.forEach(el => {
      el.style.setProperty('-webkit-text-fill-color', el.dataset.patchFill || 'transparent');
      el.style.setProperty('background', el.dataset.patchBg || '');
      el.style.setProperty('-webkit-background-clip', el.dataset.patchClip || '');
      el.style.color = el.dataset.patchColor || '';
      delete el.dataset.patchFill;
      delete el.dataset.patchBg;
      delete el.dataset.patchClip;
      delete el.dataset.patchColor;
    });

    // Convert to blob for sharing/download
    canvas.toBlob(blob => {
      if (btn) btn.disabled = false;

      // Try navigator.share on mobile
      if (navigator.share && navigator.canShare && navigator.canShare({ files: [new File([blob], 'image.png', { type: 'image/png' })] })) {
        navigator.share({
          title: 'HEX.COACH Combat Assessment',
          text: 'Check out my Cyber-Agent combat assessment!',
          files: [new File([blob], `HEX_Agent_Square_${Date.now()}.png`, { type: 'image/png' })]
        }).catch(() => {
          // Fallback: download directly
          downloadPngFallback(canvas);
        });
      } else {
        // Fallback download
        downloadPngFallback(canvas);
      }
    }, 'image/png');
  }).catch(err => {
    console.error('Poster generation failed:', err);
    if (btn) btn.disabled = false;
  });
}

function downloadPngFallback(canvas) {
  const link = document.createElement('a');
  link.download = `HEX_Agent_Square_${Date.now()}.png`;
  link.href = canvas.toDataURL('image/png');
  link.click();
}

// ═══════════════════════════════════════════════
//  Radar Animation Engine
// ═══════════════════════════════════════════════
function animateRadarChart(canvas, actualData, totalQuestions = 4, dimNames) {
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.parentElement.getBoundingClientRect();
  const size = Math.min(rect.width, rect.height);
  canvas.width = size * dpr;
  canvas.height = size * dpr;
  canvas.style.width = size + 'px';
  canvas.style.height = size + 'px';
  ctx.scale(dpr, dpr);

  const centerX = size / 2;
  const centerY = size / 2;
  const maxRadius = Math.min(centerX, centerY) - 50;

  const labels = dimNames ? dimNames.map(n => DIM_LABELS[n] || n) : ['DEEP SEA', 'COSMOS', 'WORLD RECORDS', 'ANCIENT CIV', 'IQ MATRIX', 'AI CORE'];
  const numAxes = labels.length;

  let startTime = null;
  const duration = 1500;

  function drawFrame(timestamp) {
    if (!startTime) startTime = timestamp;
    let progress = (timestamp - startTime) / duration;
    if (progress > 1) progress = 1;

    ctx.clearRect(0, 0, size, size);
    const currentMaxRadius = maxRadius * progress;

    for (let i = 1; i <= totalQuestions; i++) {
      const ringRadius = (currentMaxRadius / totalQuestions) * i;
      ctx.beginPath();
      for (let j = 0; j < numAxes; j++) {
        const angle = (Math.PI * 2 / numAxes) * j - Math.PI / 2;
        const x = centerX + Math.cos(angle) * ringRadius;
        const y = centerY + Math.sin(angle) * ringRadius;
        if (j === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.strokeStyle = `rgba(139, 92, 246, ${0.15 * progress})`;
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    ctx.beginPath();
    for (let j = 0; j < numAxes; j++) {
      const angle = (Math.PI * 2 / numAxes) * j - Math.PI / 2;
      ctx.moveTo(centerX, centerY);
      ctx.lineTo(centerX + Math.cos(angle) * currentMaxRadius, centerY + Math.sin(angle) * currentMaxRadius);
    }
    ctx.strokeStyle = `rgba(255, 255, 255, ${0.1 * progress})`;
    ctx.stroke();

    ctx.beginPath();
    for (let j = 0; j < numAxes; j++) {
      const angle = (Math.PI * 2 / numAxes) * j - Math.PI / 2;
      const scoreRatio = actualData[j] / totalQuestions;
      const currentScoreRadius = maxRadius * scoreRatio * progress;
      const x = centerX + Math.cos(angle) * currentScoreRadius;
      const y = centerY + Math.sin(angle) * currentScoreRadius;
      if (j === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.closePath();

    const fillGradient = ctx.createLinearGradient(0, 0, 0, size);
    fillGradient.addColorStop(0, `rgba(139, 92, 246, ${0.6 * progress})`);
    fillGradient.addColorStop(1, `rgba(249, 115, 22, ${0.15 * progress})`);
    ctx.fillStyle = fillGradient;
    ctx.fill();

    ctx.strokeStyle = `rgba(167, 139, 250, ${0.8 * progress})`;
    ctx.lineWidth = 2.5;
    ctx.stroke();

    for (let j = 0; j < numAxes; j++) {
      const angle = (Math.PI * 2 / numAxes) * j - Math.PI / 2;
      const scoreRatio = actualData[j] / totalQuestions;
      const currentScoreRadius = maxRadius * scoreRatio * progress;
      const x = centerX + Math.cos(angle) * currentScoreRadius;
      const y = centerY + Math.sin(angle) * currentScoreRadius;
      ctx.beginPath();
      ctx.arc(x, y, 4.5, 0, Math.PI * 2);
      ctx.fillStyle = '#f97316';
      ctx.fill();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }

    if (progress === 1) {
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 13px monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      for (let j = 0; j < numAxes; j++) {
        const angle = (Math.PI * 2 / numAxes) * j - Math.PI / 2;
        const labelX = centerX + Math.cos(angle) * (maxRadius + 20);
        const labelY = centerY + Math.sin(angle) * (maxRadius + 20);
        ctx.fillText(labels[j], labelX, labelY);
      }
      triggerLightConfetti();
    } else {
      requestAnimationFrame(drawFrame);
    }
  }

  requestAnimationFrame(drawFrame);
}

    <div style="font-weight:700;margin-bottom:0.25rem;">🧪 hex.coach ONLINE</div>
    <div style="color:#94a3b8;font-size:0.82rem;line-height:1.6;">
      Syncing data streams<span id="loadingDots">...</span>
    </div>
  `);
  try {
    await loadData();
    // Remove loading indicator and start game
    chatInner.innerHTML = '';
    initGame();
  } catch (err) {
    // Show error state
    chatInner.innerHTML = '';
    addAiBubble(`
      <div style="font-weight:700;margin-bottom:0.25rem;color:#ef4444;">⚠️ SYSTEM ERROR</div>
      <div style="color:#94a3b8;font-size:0.82rem;line-height:1.6;">
        Failed to load quiz data: ${err.message}<br>
        <span style="font-size:0.75rem;">Please check your network connection and try refreshing.</span>
      </div>
    `);
    console.error('Boot failed:', err);
  }
})();
</script>
</body>
</html>
