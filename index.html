<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>hex.coach — 六维对话竞技</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: 'Inter', sans-serif;
      background: #08080e;
      color: #e2e8f0;
      display: flex;
      flex-direction: column;
    }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #2a2a4a; border-radius: 2px; }

    /* ─── Header ─────────────────────────────── */
    #header {
      flex-shrink: 0;
      padding: 0.75rem 1rem;
      background: rgba(10,10,18,0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid #1e1e3a;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      z-index: 20;
    }
    .header-logo {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 800;
      font-size: 1.2rem;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .header-progress {
      font-size: 0.7rem;
      color: #475569;
      margin-left: auto;
    }

    /* ─── Chat container ─────────────────────── */
    #chatContainer {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 1rem 0.75rem 1rem;
      scroll-behavior: smooth;
    }
    #chatInner {
      max-width: 640px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    /* ─── Bubbles ────────────────────────────── */
    .bubble {
      max-width: 88%;
      border-radius: 1rem;
      padding: 0.7rem 0.9rem;
      font-size: 0.88rem;
      line-height: 1.55;
      animation: fadeUp 0.3s ease;
      word-break: break-word;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .bubble-ai {
      align-self: flex-start;
      background: linear-gradient(145deg, #1a1a2e, #16162a);
      border: 1px solid #2a2a4a;
      color: #e2e8f0;
      border-bottom-left-radius: 0.25rem;
    }
    .bubble-ai .author {
      font-size: 0.65rem;
      color: #6366f1;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.3rem;
      margin-bottom: 0.3rem;
    }
    .bubble-ai .author .avatar {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 20px; height: 20px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-radius: 50%;
      font-size: 0.6rem;
      color: #fff;
    }

    .bubble-user {
      align-self: flex-end;
      background: linear-gradient(135deg, #4f46e5, #6366f1);
      color: #fff;
      border-bottom-right-radius: 0.25rem;
    }

    /* ─── Bottom bar ─────────────────────────── */
    #bottomBar {
      flex-shrink: 0;
      padding: 0.6rem 0.75rem 1rem;
      background: rgba(10,10,18,0.95);
      backdrop-filter: blur(12px);
      border-top: 1px solid #1e1e3a;
      z-index: 20;
      min-height: 60px;
    }
    #bottomInner {
      max-width: 640px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    /* ─── Option buttons (adaptive wrap) ─────── */
    #optionWrap {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      justify-content: flex-end;
    }
    .opt-btn {
      flex: 0 0 auto;
      padding: 0.75rem 1.1rem;
      background: rgba(30,30,60,0.7);
      border: 1px solid #2e2e52;
      border-radius: 999px;
      color: #cbd5e1;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      -webkit-tap-highlight-color: transparent;
      white-space: nowrap;
    }
    .opt-btn:active { transform: scale(0.96); }
    .opt-btn:hover:not(.disabled) {
      background: rgba(99,102,241,0.15);
      border-color: #6366f1;
      color: #e2e8f0;
    }
    .opt-btn.correct {
      background: rgba(34,197,94,0.18);
      border-color: #22c55e;
      color: #86efac;
    }
    .opt-btn.wrong {
      background: rgba(239,68,68,0.18);
      border-color: #ef4444;
      color: #fca5a5;
    }
    .opt-btn.disabled { cursor: default; opacity: 0.6; }

    /* ─── GO! button ─────────────────────────── */
    #goBtn {
      align-self: flex-end;
      padding: 0.75rem 2.5rem;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border: none;
      border-radius: 999px;
      color: #fff;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s;
      -webkit-tap-highlight-color: transparent;
    }
    #goBtn:active { transform: scale(0.94); }
    #goBtn.disabled { opacity: 0.4; cursor: default; transform: none; }

    /* ─── Timer bar ──────────────────────────── */
    .timer-track {
      width: 100%;
      height: 3px;
      background: #1e1e3a;
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 0.25rem;
    }
    .timer-fill {
      height: 100%;
      background: linear-gradient(90deg, #6366f1, #a855f7);
      border-radius: 2px;
      transition: width 0.1s linear;
    }
    .timer-fill.warning { background: linear-gradient(90deg, #f59e0b, #ef4444); }

    /* ─── Typing dots ────────────────────────── */
    .typing-dots {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.3rem 0.1rem;
    }
    .typing-dots span {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #6366f1;
      animation: dotPulse 1.2s infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes dotPulse {
      0%,60%,100% { opacity: 0.3; transform: scale(1); }
      30% { opacity: 1; transform: scale(1.3); }
    }

    /* ─── Result card ────────────────────────── */
    .result-card {
      background: linear-gradient(145deg, #13131f, #1a1a2e);
      border: 1px solid #2a2a4a;
      border-radius: 1rem;
      padding: 1.2rem;
      margin-top: 0.3rem;
    }
    .result-card .big-score {
      font-family: 'JetBrains Mono', monospace;
      font-size: 2.8rem;
      font-weight: 800;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-align: center;
    }
    .result-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
      margin: 0.8rem 0;
    }
    .result-item {
      background: rgba(30,30,60,0.5);
      border: 1px solid #2a2a4a;
      border-radius: 0.5rem;
      padding: 0.5rem 0.6rem;
      display: flex;
      justify-content: space-between;
      font-size: 0.78rem;
    }
    .result-item .rn { color: #64748b; }
    .result-item .rs { font-weight: 700; color: #a5b4fc; }
    .restart-btn {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      width: 100%;
      padding: 0.75rem;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border: none;
      border-radius: 0.7rem;
      color: #fff;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s;
    }
    .restart-btn:active { transform: scale(0.97); }

    /* ─── Scroll anchor ──────────────────────── */
    #scrollAnchor { height: 1px; flex-shrink: 0; }
  </style>
</head>

<script>
// ═══════════════════════════════════════════════

// ═══════════════════════════════════════════════
const QUIZ_DATA = {"dimensions":[{"name":"深海","emoji":"🌊","questions":[{"id":"deep_01","question":"马里亚纳海沟最深处（挑战者深渊）的水压约为海平面大气压的多少倍？","options":["约 110 倍","约 550 倍","约 1100 倍","约 5500 倍"],"answer":2,"explanation":"深度约 11,000 米，每 10 米增 1 个大气压，故约 1,100 倍。这相当于 50 架波音 747 叠在你脚上。"},{"id":"deep_02","question":"哪种深海生物能发出红光，且是已知唯一能看到红光并以此狩猎的鱼类？","options":["鮟鱇鱼","黑龙鱼","水母","深海鳕鱼"],"answer":1,"explanation":"黑龙鱼（Malacosteus）可发射远红光并用叶绿素衍生物感知它。多数深海鱼只看蓝光，而黑龙鱼拥有自己的夜视仪。"},{"id":"deep_03","question":"深海热泉（Hydrothermal Vent）生态系统的能量来源是什么？","options":["太阳光","地热与化学合成","海底火山岩浆","放射性衰变"],"answer":1,"explanation":"深海热泉依赖化能合成细菌将 H₂S 和 CO₂ 转化为有机物，完全不依赖光合作用——这是地球上独立于太阳的第二生物圈。"},{"id":"deep_04","question":"抹香鲸能下潜到约 2,000 米深处捕食大王乌贼，它的哪个器官帮助应对巨大水压？","options":["巨大的肺","头部的鲸蜡油","厚达 30 厘米的脂肪层","可塌缩的肋骨"],"answer":1,"explanation":"抹香鲸头部的鲸蜡油（Spermaceti）可在深潜时冷却凝固（密度变大），帮助浮力调节且保护脑部不被压扁，鲸蜡油也因此得名。"},{"id":"deep_05","question":"目前已知最深的活鱼记录是在什么深度发现的？","options":["约 4,000 米","约 5,800 米","约 8,300 米","约 10,900 米"],"answer":2,"explanation":"2014 年在马里亚纳海沟 8,143 米处发现狮子鱼（Pseudoliparis swirei）。2017 年日本深海科考又在 8,178 米拍到了同类。"}]},{"name":"星空","emoji":"⭐","questions":[{"id":"star_01","question":"一个秒差距（Parsec）大约相当于多少光年？","options":["1.5 光年","3.26 光年","5.88 光年","10.5 光年"],"answer":1,"explanation":"1 pc ≈ 3.2616 ly。定义：当天文单位（1 AU）对应 1 角秒的视差时，观测者与目标之间的距离。千年隼号跑完 Kessel 跑道的 12 pc 就是《星球大战》经典梗。"},{"id":"star_02","question":"中子星上一茶匙的物质在地球上大约有多重？","options":["10 吨","100 吨","1,000 万吨","10 亿吨"],"answer":3,"explanation":"中子星密度约 4×10¹⁷ kg/m³，一茶匙（5 mL）质量约 20 亿吨。这相当于将所有人类压缩到方糖大小。"},{"id":"star_03","question":"银河系中心超大质量黑洞的名称和最近确认的新闻是什么？","options":["M87*，2019 年首张照片","Sagittarius A*，2022 年事件视界望远镜发布照片","TON 618，被发现是宇宙最大黑洞","Cygnus X-1，2021 年质量更新"],"answer":1,"explanation":"人马座 A*（Sgr A*），质量约 400 万倍太阳。EHT 在 2022 年 5 月发布了其照片，距 M87* 首照三年后，证实了其存在。"},{"id":"star_04","question":"宇宙微波背景辐射（CMB）的温度大约是多少？","options":["零下 200°C","2.725 K","10 K","0 K"],"answer":1,"explanation":"CMB 是宇宙大爆炸约 38 万年后的余晖，当前温度 2.725 K（约 -270.4°C），是宇宙最完美的黑体辐射谱，精确度达 10⁻⁵。"},{"id":"star_05","question":"科学家发现的最快轨道速度的系外行星有多快？什么原因？","options":["约 1,000 km/s，双星引力弹弓","约 480 km/s，被恒星潮汐剥离","约 200 km/s，超大质量黑洞抛射","约 50 km/s，普通恒星引力"],"answer":0,"explanation":"Swift J1756.9-2508 系统的行星以约 1,000 km/s 绕中子星公转（地球仅 30 km/s）。如果它在太阳系，从地球到月球只需 6 分钟。"}]},{"name":"世界之最","emoji":"🏆","questions":[{"id":"record_01","question":"地球上最长的不间断山脉是哪座？","options":["喜马拉雅山脉","安第斯山脉","大洋中脊","洛基山脉"],"answer":2,"explanation":"大洋中脊（Mid-Ocean Ridge）全长约 65,000 公里，是地球上最长山脉，几乎全部在水下。安第斯才 7,000 公里，不及它十分之一。"},{"id":"record_02","question":"人类已知的最短命的大型动物是什么？","options":["蜉蝣","灯蛾毛虫","侏儒虾虎鱼","雄性蜂鸟"],"answer":2,"explanation":"侏儒虾虎鱼（Eviota sigillata）之寿命仅 59 天，为脊椎动物最短。蜉蝣幼虫可活数年，只是成虫仅活数小时——总寿命远长于虾虎鱼。"},{"id":"record_03","question":"宇宙中已知最明亮的类星体是哪个？","options":["3C 273","S5 0014+81","SMSS J2157-3602","TON 618"],"answer":3,"explanation":"TON 618 光度高达 4×10⁴¹ 瓦，相当于 140 万亿个太阳，是已知最亮类星体。其中心黑洞约 660 亿倍太阳质量，也是已知最大黑洞。"},{"id":"record_04","question":"地球上最干燥（降水量最少）的地方是哪里？","options":["撒哈拉沙漠","南极干谷","阿塔卡马沙漠","戈壁沙漠"],"answer":2,"explanation":"智利阿塔卡马沙漠的亚里卡（Arica）年均降水 0.5 mm，但南极麦克默多干谷已数百万年无降水，是地球上最干燥的地方。"},{"id":"record_05","question":"人类飞行到达的最远人造物体是？距离多远？","options":["旅行者 1号，约 240 亿公里","新视野号，约 80 亿公里","先驱者 10号，约 120 亿公里","旅行者 2号，约 200 亿公里"],"answer":0,"explanation":"旅行者 1号（1977 年发射）截至 2024 年距地约 162 AU（240 亿公里），是唯一进入星际空间的人造物。它的信号以光速需 22.5 小时才能到达地球。"}]},{"name":"古文明","emoji":"🏛️","questions":[{"id":"ancient_01","question":"已知最古老的法典是哪一部？","options":["汉谟拉比法典","乌尔纳姆法典","十二铜表法","摩奴法典"],"answer":1,"explanation":"《乌尔纳姆法典》（约公元前 2100 年）比汉谟拉比早了约 300 年，由苏美尔乌尔第三王朝创立。其中已有罚金代替肉刑的规定——相当超前。"},{"id":"ancient_02","question":"古埃及人建造金字塔时使用的铜制工具最缺乏哪种性能？","options":["硬度","韧性","抗腐蚀性","密度"],"answer":0,"explanation":"自然界铜的硬度（莫氏 3）远低于花岗岩（莫氏 7）。古埃及人用铜锯加石英砂岩磨削花岗岩，一块巨石需数百人数周时间。没铁器才如此耗时。"},{"id":"ancient_03","question":"特洛伊古城真正的地理位置（根据考古学）在哪里？","options":["希腊雅典附近","土耳其希萨利克","意大利西西里","埃及亚历山大"],"answer":1,"explanation":"1870 年海因里希·施利曼在土耳其西北的希萨利克（Hisarlik）发掘出 9 层特洛伊遗址。特洛伊 VII 层（约前 1300 年）被认为是荷马史诗中的特洛伊。"},{"id":"ancient_04","question":"玛雅数字系统中 0 的符号是什么？","options":["一个点","一根横线","一个贝壳/眼睛形符号","一个倒V"],"answer":2,"explanation":"玛雅人在公元前 3 世纪独立发明了零的概念和符号（贝壳形），比印度数学早几个世纪。它是人类仅有的两个独立发明零的文明之一。"},{"id":"ancient_05","question":"秦始皇陵中未开封的陪葬坑哪个最著名并使用非破坏性探测技术？","options":["兵马俑二号坑","石甲坑","百戏俑坑","水银地宫"],"answer":3,"explanation":"地宫尚未发掘，但 2002 年利用 μ 子探测和中子扫描确认地宫内部结构，汞含量异常高（史书记载以水银为百川江河大海），证实司马迁记载。"}]},{"name":"智商测试","emoji":"🧠","questions":[{"id":"iq_01","question":"下面哪个数字与其他的不属于同一类？3, 5, 7, 11, 13, 15","options":["3","13","15","11"],"answer":2,"explanation":"15 是合数（3×5），其余均为质数。质数是大于 1 且只能被 1 和自身整除的自然数，是数论的核心构件。"},{"id":"iq_02","question":"如果 Banana = 5，Apple = 3，Strawberry = 9，Orange = 5，那么 Grape = ?","options":["2","3","4","6"],"answer":0,"explanation":"编码规则是每个大写字母中包含的封闭环数量：G(0)+R(0)+A(1)+P(1)+E(0)=2。A=1环,B=2环,D=1环,O=1环,P=1环。题目考察符号模式识别能力。"},{"id":"iq_03","question":"3, 8, 15, 24, 35, ? 请问下一个数是什么？","options":["44","46","48","50"],"answer":2,"explanation":"规律：n²-1。2²-1=3，3²-1=8，4²-1=15，5²-1=24，6²-1=35，7²-1=48。这是一个经典数列规律，考察对二次关系的敏感度。"},{"id":"iq_04","question":"经典火柴题：只能移动一根火柴使等式 8 + 3 = 0 成立。以下哪种方法正确？","options":["移动 8 的中间火柴到 0 中间，得到 6+3=9","移动 0 的火柴到 8 上，得到 9+3=12","移动 8 的左上火柴到 3 上，得到 9+3=12","无解"],"answer":0,"explanation":"将 8 中间的一根火柴移走（8 变成 6），放到 0 中间（0 变成 9），得到 6+3=9。移动 1 根即可达成，考察数字火柴的几何变换想象。"},{"id":"iq_05","question":"一个人朝南走 1 公里，朝东走 1 公里，朝北走 1 公里后回到了起点。起点在哪里？","options":["北极点","赤道","南极点附近某纬度圈","无法确定"],"answer":2,"explanation":"北极点是众知解。但还有无数解：在南半球某纬度圈（使得东走 1 公里正好绕该纬度整数圈），再朝北 1 公里回到原点。展示了地球非欧几何特性。"}]},{"name":"AI","emoji":"🤖","questions":[{"id":"ai_01","question":"2024 年诺贝尔物理学奖授予了谁？为什么备受 AI 界关注？","options":["John Hopfield 和 Geoffrey Hinton，因人工神经网络的基础发现","Demis Hassabis 和 John Jumper，因 AlphaFold","Yann LeCun 和 Yoshua Bengio，因深度学习","Andrej Karpathy 和 Ilya Sutskever，因 GPT"],"answer":0,"explanation":"2024 诺贝尔物理学奖出人意料地授予 Hopfield 和 Hinton，表彰他们在人工神经网络和机器学习方面的基础性贡献。这是 AI 首次赢得诺贝尔物理学奖。"},{"id":"ai_02","question":"Transformer 架构中自注意力（Self-Attention）的计算复杂度是多少？","options":["O(n)","O(n log n)","O(n²)","O(2ⁿ)"],"answer":2,"explanation":"标准自注意力的复杂度为 O(n²·d)，n 为序列长度。每个 token 都要与所有其他 token 计算 attention score，这使得长文本处理极其昂贵。"},{"id":"ai_03","question":"AI 对齐（AI Alignment）的核心目标是什么？","options":["让 AI 的输出与数学公式对齐","确保 AI 系统的目标和价值观符合人类意图","让多个 AI 模型有相同的参数量","让 AI 生成的内容符合语法规则"],"answer":1,"explanation":"AI 对齐是指确保 AI 系统追求的目标与人类的真实意图和价值观一致。RLHF（基于人类反馈的强化学习）是目前最主流的对齐技术。"},{"id":"ai_04","question":"GPT-4 的上下文窗口（Context Window）大小在早期版本中最大是多少？","options":["2,048 tokens","8,192 tokens","32,768 tokens","128,000 tokens"],"answer":2,"explanation":"GPT-4 最初发布时支持 8K 和 32K 两个版本。2024 年 GPT-4 Turbo 扩展到 128K。作为对比，BERT 仅为 512 tokens——三年增长了 256 倍。"},{"id":"ai_05","question":"机器学习中过拟合（Overfitting）的典型表现是什么？","options":["训练集和测试集准确率都很高","训练集准确率很高，测试集准确率很低","训练集和测试集准确率都很低","模型参数量过大"],"answer":1,"explanation":"过拟合指模型在训练数据上表现完美（甚至记住噪声），但在未见数据上泛化能力差——相当于考试背答案而非理解知识。Dropout、正则化、早停法是常用缓解手段。"}]}]};

// ─── Tone pools ──────────────────────────────
const PRAISE = ['天才！', '绝了！', '稳如老狗！', '脑容量爆表！'];
const BOO = ['大意了！', '危！', '痛失一臂！', 'CPU烧了？'];
const TIMEOUT_TEASE = [
  '兄弟，你掉线了吗？',
  '去洗手间忘了带手机？',
  '断网了还是CPU烧了，兄弟？',
  '歪？人还在吗，给个反应！',
  '再不选，特工先去喝杯咖啡了☕'
];
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

// ─── State ───────────────────────────────────
let quiz = [];
let currentIndex = 0;
let correctCount = 0;
let dimensionResults = {};
let timer = null;
let locked = false;       // prevent double clicks during transitions

// ─── DOM refs ────────────────────────────────
const chatInner = document.getElementById('chatInner');
const bottomInner = document.getElementById('bottomInner');
const headerProgress = document.getElementById('headerProgress');
const anchor = document.getElementById('scrollAnchor');

// ─── Helpers ────────────────────────────────
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
function pickRandom(arr, n) {
  const copy = [...arr]; shuffle(copy); return copy.slice(0, n);
}
function scrollBottom() {
  requestAnimationFrame(() => anchor.scrollIntoView({ behavior: 'smooth' }));
}

// ─── Bubble builders ───────────────────────
function addAiBubble(html) {
  const div = document.createElement('div');
  div.className = 'bubble bubble-ai';
  div.innerHTML = `<div class="author"><span class="avatar">🤖</span> hex.coach</div>${html}`;
  chatInner.appendChild(div);
  scrollBottom();
}

function addUserBubble(text) {
  const div = document.createElement('div');
  div.className = 'bubble bubble-user';
  div.textContent = text;
  chatInner.appendChild(div);
  scrollBottom();
}

function addTypingBubble() {
  const div = document.createElement('div');
  div.className = 'bubble bubble-ai';
  div.id = 'typingBubble';
  div.innerHTML = `<div class="author"><span class="avatar">🤖</span> hex.coach</div><div class="typing-dots"><span></span><span></span><span></span></div>`;
  chatInner.appendChild(div);
  scrollBottom();
  return div;
}

function removeTyping() {
  const tb = document.getElementById('typingBubble');
  if (tb) tb.remove();
}

// ─── Build quiz ─────────────────────────────
function buildQuiz() {
  quiz = [];
  dimensionResults = {};
  for (const dim of QUIZ_DATA.dimensions) {
    const picked = pickRandom(dim.questions, 3);
    for (const q of picked) {
      quiz.push({ ...q, dimensionName: dim.name, dimensionEmoji: dim.emoji });
    }
    dimensionResults[dim.name] = { correct: 0, total: 3, emoji: dim.emoji };
  }
  shuffle(quiz);
}

// ═══════════════════════════════════════════════
//  PHASE 1: Init → "准备好了吗？" + GO! button
// ═══════════════════════════════════════════════
function initGame() {
  correctCount = 0;
  currentIndex = 0;
  buildQuiz();
  chatInner.innerHTML = '';
  bottomInner.innerHTML = '';
  headerProgress.textContent = `0/${quiz.length}`;

  // AI welcome
  addAiBubble(`
    <div style="font-weight:700;margin-bottom:0.25rem;">🧪 hex.coach 已上线</div>
    <div style="color:#94a3b8;font-size:0.82rem;line-height:1.6;">
      从六个维度随机抽题轰炸你的大脑。<br>
      准备好了吗？
    </div>
  `);

  // GO! button
  const go = document.createElement('button');
  go.id = 'goBtn';
  go.textContent = 'GO!';
  go.addEventListener('click', () => handleGo(go));
  bottomInner.appendChild(go);
  scrollBottom();
}

// ═══════════════════════════════════════════════
//  PHASE 2: GO! → user bubble → typing → question
// ═══════════════════════════════════════════════
function handleGo(goBtn) {
  if (locked) return;
  locked = true;

  // GO! stays as user bubble in chat
  addUserBubble('GO!');

  // Disable the button visually
  goBtn.classList.add('disabled');
  goBtn.style.pointerEvents = 'none';

  // Typing → first question
  addTypingBubble();
  setTimeout(() => {
    removeTyping();
    askQuestion();
    // locked released inside askQuestion after options appear
  }, 600);
}

// ═══════════════════════════════════════════════
//  PHASE 3: Show question → options appear
// ═══════════════════════════════════════════════
function askQuestion() {
  if (currentIndex >= quiz.length) { showResult(); return; }

  const q = quiz[currentIndex];
  headerProgress.textContent = `${currentIndex + 1}/${quiz.length}`;

  // AI sends question bubble (no dimension badge? include dim for context)
  addAiBubble(`
    <div style="font-size:0.7rem;color:#818cf8;margin-bottom:0.3rem;">${q.dimensionEmoji} ${q.dimensionName}</div>
    <div style="font-weight:600;">${q.question}</div>
  `);

  // Render option buttons (adaptive wrap, no A/B/C/D)
  bottomInner.innerHTML = '';
  const timerWrap = document.createElement('div');
  timerWrap.className = 'timer-track';
  timerWrap.innerHTML = '<div class="timer-fill" id="timerFill" style="width:100%"></div>';
  bottomInner.appendChild(timerWrap);

  const optWrap = document.createElement('div');
  optWrap.id = 'optionWrap';
  q.options.forEach((opt) => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.textContent = opt;
    btn.addEventListener('click', () => handleAnswer(opt, btn));
    optWrap.appendChild(btn);
  });
  bottomInner.appendChild(optWrap);
  scrollBottom();
  startTimer();
  locked = false;  // now user can answer
}

// ─── Timer ─────────────────────────────────
function startTimer() {
  clearInterval(timer);
  const fill = document.getElementById('timerFill');
  if (!fill) return;
  const start = Date.now();
  const dur = 15 * 1000;
  timer = setInterval(() => {
    const elapsed = Date.now() - start;
    const remain = Math.max(0, dur - elapsed);
    const pct = (remain / dur) * 100;
    fill.style.width = pct + '%';
    fill.classList.toggle('warning', pct < 35);
    if (remain <= 0) {
      clearInterval(timer);
      if (!locked) handleTimeout();
    }
  }, 50);
}

// ═══════════════════════════════════════════════
//  PHASE 4: Answer → user bubble → typing → AI response → next
// ═══════════════════════════════════════════════
function handleAnswer(optionText, clickedBtn) {
  if (locked) return;
  locked = true;
  clearInterval(timer);

  const q = quiz[currentIndex];
  const isCorrect = optionText === q.options[q.answer];

  // Highlight buttons
  document.querySelectorAll('.opt-btn').forEach((btn) => {
    btn.classList.add('disabled');
    if (btn.textContent === q.options[q.answer]) btn.classList.add('correct');
    else if (btn === clickedBtn && !isCorrect) btn.classList.add('wrong');
  });

  // User bubble (no label prefix)
  addUserBubble(optionText);

  // Clear bottom area immediately
  bottomInner.innerHTML = '';

  // Score
  if (isCorrect) {
    correctCount++;
    dimensionResults[q.dimensionName].correct++;
  }

  // Typing → AI response
  addTypingBubble();
  setTimeout(() => {
    removeTyping();

    const tone = isCorrect ? pick(PRAISE) : pick(BOO);
    const answerText = q.options[q.answer];

    addAiBubble(`
      <div style="font-weight:700;margin-bottom:0.25rem;">${isCorrect ? '✅' : '💡'} ${tone}</div>
      <div style="color:#818cf8;font-size:0.82rem;margin-bottom:0.3rem;">${answerText}</div>
      <div style="color:#94a3b8;font-size:0.8rem;line-height:1.6;">${q.explanation}</div>
    `);

    // Advance after 1.5s
    currentIndex++;
    setTimeout(() => {
      askQuestion();
    }, 1500);
  }, 700);
}

// ═══════════════════════════════════════════════
//  PHASE 4b: Timeout → tease bubble (non-blocking)
// ═══════════════════════════════════════════════
function handleTimeout() {
  if (locked) return;
  locked = true;
  const q = quiz[currentIndex];

  // Highlight correct option only (no wrong selection)
  document.querySelectorAll('.opt-btn').forEach((btn) => {
    btn.classList.add('disabled');
    if (btn.textContent === q.options[q.answer]) btn.classList.add('correct');
  });

  // Send a teasing bubble — does NOT consume the question
  addAiBubble(`
    <div style="font-weight:700;margin-bottom:0.25rem;">⏰ ${pick(TIMEOUT_TEASE)}</div>
  `);

  // User can still click options — re-enable
  locked = false;
  // Restart timer for remaining time? Simpler: keep the timer expired state, user can still click
  // Re-enable buttons (except correct highlight stays)
  document.querySelectorAll('.opt-btn').forEach((btn) => {
    if (!btn.classList.contains('correct')) btn.classList.remove('disabled');
  });
  // We restart a fresh timer
  startTimer();
}

// ═══════════════════════════════════════════════
//  RESULT
// ═══════════════════════════════════════════════
function showResult() {
  bottomInner.innerHTML = '';
  headerProgress.textContent = '✓ 完成';
  const pct = Math.round((correctCount / quiz.length) * 100);
  let dims = '';
  for (const [name, data] of Object.entries(dimensionResults)) {
    dims += `<div class="result-item"><span class="rn">${data.emoji} ${name}</span><span class="rs">${data.correct}/${data.total}</span></div>`;
  }
  addAiBubble(`
    <div class="result-card">
      <div class="big-score">${correctCount}/${quiz.length}</div>
      <div style="text-align:center;color:#64748b;font-size:0.8rem;margin-bottom:0.3rem;">正确率 ${pct}%</div>
      <div class="result-grid">${dims}</div>
      <button class="restart-btn" onclick="restartGame()">[ 再来一次 ]</button>
    </div>
  `);
}

function restartGame() {
  locked = true;
  clearInterval(timer);
  initGame();
  locked = false;
}

// ─── Boot ───────────────────────────────────
initGame();
</script>
