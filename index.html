<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>hex.coach — 六维科学竞技</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Inter:wght@400;600;700;800&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: #0a0a0f;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 720px;
      padding: 1.5rem;
    }

    .card {
      background: linear-gradient(145deg, #13131f 0%, #1a1a2e 100%);
      border: 1px solid #2a2a4a;
      border-radius: 1.25rem;
      padding: 2rem;
      box-shadow: 0 25px 60px rgba(0,0,0,0.7), 0 0 40px rgba(99,102,241,0.06);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at 30% 20%, rgba(99,102,241,0.04) 0%, transparent 50%);
      pointer-events: none;
    }

    /* Progress bar */
    .timer-track {
      width: 100%;
      height: 6px;
      background: #1e1e3a;
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 1.5rem;
    }

    .timer-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #6366f1, #a855f7);
      border-radius: 3px;
      transition: width 0.1s linear;
    }

    .timer-fill.warning { background: linear-gradient(90deg, #f59e0b, #ef4444); }

    /* Dimension badge */
    .dimension-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: rgba(99,102,241,0.12);
      border: 1px solid rgba(99,102,241,0.25);
      padding: 0.3rem 0.85rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      color: #a5b4fc;
      margin-bottom: 1rem;
      letter-spacing: 0.02em;
    }

    .progress-text {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      color: #64748b;
      text-align: right;
      margin-bottom: 0.75rem;
    }

    .question-text {
      font-size: 1.15rem;
      font-weight: 700;
      line-height: 1.6;
      margin-bottom: 1.5rem;
      color: #f1f5f9;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
    }

    .option-btn {
      width: 100%;
      text-align: left;
      padding: 0.85rem 1.1rem;
      background: rgba(30,30,60,0.6);
      border: 1px solid #2a2a4a;
      border-radius: 0.7rem;
      color: #cbd5e1;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .option-btn:hover:not(.disabled) {
      background: rgba(99,102,241,0.12);
      border-color: #6366f1;
      color: #e2e8f0;
    }

    .option-btn .label {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: rgba(99,102,241,0.15);
      color: #818cf8;
      font-size: 0.75rem;
      font-weight: 700;
      flex-shrink: 0;
      transition: all 0.2s;
    }

    .option-btn.correct {
      background: rgba(34,197,94,0.15);
      border-color: #22c55e;
      color: #86efac;
    }
    .option-btn.correct .label { background: #22c55e; color: #052e16; }

    .option-btn.wrong {
      background: rgba(239,68,68,0.15);
      border-color: #ef4444;
      color: #fca5a5;
    }
    .option-btn.wrong .label { background: #ef4444; color: #450a0a; }

    .option-btn.reveal-correct {
      background: rgba(34,197,94,0.08);
      border-color: rgba(34,197,94,0.3);
    }

    .option-btn.disabled { cursor: default; opacity: 0.85; }

    /* Explanation overlay */
    .explanation-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(10,10,20,0.92);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
      border-radius: 1.25rem;
      z-index: 10;
    }

    .explanation-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .explanation-icon {
      font-size: 2.5rem;
      margin-bottom: 0.75rem;
    }

    .explanation-title {
      font-size: 1.1rem;
      font-weight: 800;
      margin-bottom: 0.5rem;
    }
    .explanation-title.correct-title { color: #22c55e; }
    .explanation-title.wrong-title { color: #ef4444; }

    .explanation-text {
      font-size: 0.88rem;
      line-height: 1.7;
      color: #cbd5e1;
      text-align: center;
      max-width: 500px;
    }

    /* Start screen */
    #startScreen {
      text-align: center;
    }

    .logo {
      font-family: 'JetBrains Mono', monospace;
      font-size: 2rem;
      font-weight: 800;
      background: linear-gradient(135deg, #6366f1, #a855f7, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }

    .subtitle {
      color: #64748b;
      font-size: 0.9rem;
      margin-bottom: 2rem;
    }

    .dimension-list {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 2rem;
    }

    .dimension-tag {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.35rem 0.75rem;
      background: rgba(99,102,241,0.08);
      border: 1px solid rgba(99,102,241,0.15);
      border-radius: 999px;
      font-size: 0.75rem;
      color: #a5b4fc;
    }

    .start-btn {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: 1rem;
      padding: 0.85rem 2.5rem;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border: none;
      border-radius: 0.75rem;
      color: #fff;
      cursor: pointer;
      transition: all 0.25s;
      box-shadow: 0 4px 20px rgba(99,102,241,0.3);
    }

    .start-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 30px rgba(99,102,241,0.45);
    }

    .start-btn:active { transform: translateY(0); }

    /* Results screen */
    #resultScreen {
      text-align: center;
    }

    .result-score {
      font-family: 'JetBrains Mono', monospace;
      font-size: 3.5rem;
      font-weight: 800;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 0.5rem 0;
    }

    .result-details {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
      margin: 1.5rem 0;
    }

    .result-dim-item {
      background: rgba(30,30,60,0.5);
      border: 1px solid #2a2a4a;
      border-radius: 0.6rem;
      padding: 0.6rem;
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
    }

    .result-dim-item .dim-name { color: #94a3b8; }
    .result-dim-item .dim-score { font-weight: 700; color: #a5b4fc; }

    .restart-btn {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      padding: 0.75rem 2rem;
      background: rgba(99,102,241,0.15);
      border: 1px solid #6366f1;
      border-radius: 0.75rem;
      color: #a5b4fc;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 0.5rem;
    }

    .restart-btn:hover {
      background: rgba(99,102,241,0.25);
    }

    .hidden { display: none; }

    /* Footer */
    .footer {
      text-align: center;
      margin-top: 1rem;
      font-size: 0.7rem;
      color: #334155;
      letter-spacing: 0.05em;
    }

    .footer a { color: #334155; text-decoration: none; }
    .footer a:hover { color: #475569; }
  </style>
</head>
<body>
<div class="container">
  <!-- START SCREEN -->
  <div id="startScreen" class="card">
    <div class="logo">hex.coach</div>
    <div class="subtitle">六维智商 · 科学竞技</div>
    <div class="dimension-list" id="dimensionTags"></div>
    <button class="start-btn" onclick="startQuiz()">[ 开始挑战 ]</button>
    <div class="footer">每个维度随机 3 题 · 共 18 题 · 每题 15 秒</div>
  </div>

  <!-- QUIZ SCREEN -->
  <div id="quizScreen" class="card hidden" style="position:relative;">
    <div class="timer-track"><div class="timer-fill" id="timerFill"></div></div>
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <span class="dimension-badge" id="dimensionBadge">🌊 深海</span>
      <span class="progress-text" id="progressText">1 / 18</span>
    </div>
    <div class="question-text" id="questionText">题目加载中...</div>
    <div class="options-grid" id="optionsContainer"></div>

    <!-- Explanation Overlay -->
    <div class="explanation-overlay" id="explanationOverlay">
      <div class="explanation-icon" id="explanationIcon">✅</div>
      <div class="explanation-title" id="explanationTitle">回答正确！</div>
      <div class="explanation-text" id="explanationText"></div>
    </div>
  </div>

  <!-- RESULT SCREEN -->
  <div id="resultScreen" class="card hidden">
    <div style="font-size:0.85rem;color:#64748b;margin-bottom:0.25rem;">最终成绩</div>
    <div class="result-score" id="finalScore">0/18</div>
    <div style="font-size:0.8rem;color:#64748b;margin-bottom:1rem;" id="scorePercent">0%</div>
    <div class="result-details" id="resultDetails"></div>
    <button class="restart-btn" onclick="restartQuiz()">[ 再来一次 ]</button>
  </div>
</div>

<script>
// ─── Embedded quiz_data (no fetch needed, works with file://) ─────────
const QUIZ_DATA = {"dimensions":[{"name":"深海","emoji":"🌊","questions":[{"id":"deep_01","question":"马里亚纳海沟最深处（挑战者深渊）的水压约为海平面大气压的多少倍？","options":["约 110 倍","约 550 倍","约 1100 倍","约 5500 倍"],"answer":2,"explanation":"深度约 11,000 米，每 10 米增 1 个大气压，故约 1,100 倍。这相当于 50 架波音 747 叠在你脚上。"},{"id":"deep_02","question":"哪种深海生物能发出红光，且是已知唯一能看到红光并以此狩猎的鱼类？","options":["鮟鱇鱼","黑龙鱼","水母","深海鳕鱼"],"answer":1,"explanation":"黑龙鱼（Malacosteus）可发射远红光并用叶绿素衍生物感知它。多数深海鱼只看蓝光，而黑龙鱼拥有自己的夜视仪。"},{"id":"deep_03","question":"深海热泉（Hydrothermal Vent）生态系统的能量来源是什么？","options":["太阳光","地热与化学合成","海底火山岩浆","放射性衰变"],"answer":1,"explanation":"深海热泉依赖化能合成细菌将 H₂S 和 CO₂ 转化为有机物，完全不依赖光合作用——这是地球上独立于太阳的第二生物圈。"},{"id":"deep_04","question":"抹香鲸能下潜到约 2,000 米深处捕食大王乌贼，它的哪个器官帮助应对巨大水压？","options":["巨大的肺","头部的鲸蜡油","厚达 30 厘米的脂肪层","可塌缩的肋骨"],"answer":1,"explanation":"抹香鲸头部的鲸蜡油（Spermaceti）可在深潜时冷却凝固（密度变大），帮助浮力调节且保护脑部不被压扁，鲸蜡油也因此得名。"},{"id":"deep_05","question":"目前已知最深的活鱼记录是在什么深度发现的？","options":["约 4,000 米","约 5,800 米","约 8,300 米","约 10,900 米"],"answer":2,"explanation":"2014 年在马里亚纳海沟 8,143 米处发现狮子鱼（Pseudoliparis swirei）。2017 年日本深海科考又在 8,178 米拍到了同类。"}]},{"name":"星空","emoji":"⭐","questions":[{"id":"star_01","question":"一个秒差距（Parsec）大约相当于多少光年？","options":["1.5 光年","3.26 光年","5.88 光年","10.5 光年"],"answer":1,"explanation":"1 pc ≈ 3.2616 ly。定义：当天文单位（1 AU）对应 1 角秒的视差时，观测者与目标之间的距离。千年隼号跑完 Kessel 跑道的 12 pc 就是《星球大战》经典梗。"},{"id":"star_02","question":"中子星上一茶匙的物质在地球上大约有多重？","options":["10 吨","100 吨","1,000 万吨","10 亿吨"],"answer":3,"explanation":"中子星密度约 4×10¹⁷ kg/m³，一茶匙（5 mL）质量约 20 亿吨。这相当于将所有人类压缩到方糖大小。"},{"id":"star_03","question":"银河系中心超大质量黑洞的名称和最近确认的新闻是什么？","options":["M87*，2019 年首张照片","Sagittarius A*，2022 年事件视界望远镜发布照片","TON 618，被发现是宇宙最大黑洞","Cygnus X-1，2021 年质量更新"],"answer":1,"explanation":"人马座 A*（Sgr A*），质量约 400 万倍太阳。EHT 在 2022 年 5 月发布了其照片，距 M87* 首照三年后，证实了其存在。"},{"id":"star_04","question":"宇宙微波背景辐射（CMB）的温度大约是多少？","options":["零下 200°C","2.725 K","10 K","0 K"],"answer":1,"explanation":"CMB 是宇宙大爆炸约 38 万年后的余晖，当前温度 2.725 K（约 -270.4°C），是宇宙最完美的黑体辐射谱，精确度达 10⁻⁵。"},{"id":"star_05","question":"科学家发现的最快轨道速度的系外行星有多快？什么原因？","options":["约 1,000 km/s，双星引力弹弓","约 480 km/s，被恒星潮汐剥离","约 200 km/s，超大质量黑洞抛射","约 50 km/s，普通恒星引力"],"answer":0,"explanation":"Swift J1756.9-2508 系统的行星以约 1,000 km/s 绕中子星公转（地球仅 30 km/s）。如果它在太阳系，从地球到月球只需 6 分钟。"}]},{"name":"世界之最","emoji":"🏆","questions":[{"id":"record_01","question":"地球上最长的不间断山脉是哪座？","options":["喜马拉雅山脉","安第斯山脉","大洋中脊","洛基山脉"],"answer":2,"explanation":"大洋中脊（Mid-Ocean Ridge）全长约 65,000 公里，是地球上最长山脉，几乎全部在水下。安第斯才 7,000 公里，不及它十分之一。"},{"id":"record_02","question":"人类已知的最短命的大型动物是什么？","options":["蜉蝣","灯蛾毛虫","侏儒虾虎鱼","雄性蜂鸟"],"answer":2,"explanation":"侏儒虾虎鱼（Eviota sigillata）之寿命仅 59 天，为脊椎动物最短。蜉蝣幼虫可活数年，只是成虫仅活数小时——总寿命远长于虾虎鱼。"},{"id":"record_03","question":"宇宙中已知最明亮的类星体是哪个？","options":["3C 273","S5 0014+81","SMSS J2157-3602","TON 618"],"answer":3,"explanation":"TON 618 光度高达 4×10⁴¹ 瓦，相当于 140 万亿个太阳，是已知最亮类星体。其中心黑洞约 660 亿倍太阳质量，也是已知最大黑洞。"},{"id":"record_04","question":"地球上最干燥（降水量最少）的地方是哪里？","options":["撒哈拉沙漠","南极干谷","阿塔卡马沙漠","戈壁沙漠"],"answer":2,"explanation":"智利阿塔卡马沙漠的亚里卡（Arica）年均降水 0.5 mm，但南极麦克默多干谷已数百万年无降水，是地球上最干燥的地方。"},{"id":"record_05","question":"人类飞行到达的最远人造物体是？距离多远？","options":["旅行者 1号，约 240 亿公里","新视野号，约 80 亿公里","先驱者 10号，约 120 亿公里","旅行者 2号，约 200 亿公里"],"answer":0,"explanation":"旅行者 1号（1977 年发射）截至 2024 年距地约 162 AU（240 亿公里），是唯一进入星际空间的人造物。它的信号以光速需 22.5 小时才能到达地球。"}]},{"name":"古文明","emoji":"🏛️","questions":[{"id":"ancient_01","question":"已知最古老的法典是哪一部？","options":["汉谟拉比法典","乌尔纳姆法典","十二铜表法","摩奴法典"],"answer":1,"explanation":"《乌尔纳姆法典》（约公元前 2100 年）比汉谟拉比早了约 300 年，由苏美尔乌尔第三王朝创立。其中已有罚金代替肉刑的规定——相当超前。"},{"id":"ancient_02","question":"古埃及人建造金字塔时使用的铜制工具最缺乏哪种性能？","options":["硬度","韧性","抗腐蚀性","密度"],"answer":0,"explanation":"自然界铜的硬度（莫氏 3）远低于花岗岩（莫氏 7）。古埃及人用铜锯加石英砂岩磨削花岗岩，一块巨石需数百人数周时间。没铁器才如此耗时。"},{"id":"ancient_03","question":"特洛伊古城真正的地理位置（根据考古学）在哪里？","options":["希腊雅典附近","土耳其希萨利克","意大利西西里","埃及亚历山大"],"answer":1,"explanation":"1870 年海因里希·施利曼在土耳其西北的希萨利克（Hisarlik）发掘出 9 层特洛伊遗址。特洛伊 VII 层（约前 1300 年）被认为是荷马史诗中的特洛伊。"},{"id":"ancient_04","question":"玛雅数字系统中 tion":"标准自注意力的复杂度为 O(n²·d)，n 为序列长度。每个 token 都要与所有其他 token 计算 attention score，这使得长文本处理极其昂贵。"},{"id":"ai_03","question":"AI 对齐（AI Alignment）的核心目标是什么？","options":["让 AI 的输出与数学公式对齐","确保 AI 系统的目标和价值观符合人类意图","让多个 AI 模型有相同的参数量","让 AI 生成的内容符合语法规则"],"answer":1,"explanation":"AI 对齐是指确保 AI 系统追求的目标与人类的真实意图和价值观一致。RLHF（基于人类反馈的强化学习）是目前最主流的对齐技术。"},{"id":"ai_04","question":"GPT-4 的上下文窗口（Context Window）大小在早期版本中最大是多少？","options":["2,048 tokens","8,192 tokens","32,768 tokens","128,000 tokens"],"answer":2,"explanation":"GPT-4 最初发布时支持 8K 和 32K 两个版本。2024 年 GPT-4 Turbo 扩展到 128K。作为对比，BERT 仅为 512 tokens——三年增长了 256 倍。"},{"id":"ai_05","question":"机器学习中过拟合（Overfitting）的典型表现是什么？","options":["训练集和测试集准确率都很高","训练集准确率很高，测试集准确率很低","训练集和测试集准确率都很低","模型参数量过大"],"answer":1,"explanation":"过拟合指模型在训练数据上表现完美（甚至记住噪声），但在未见数据上泛化能力差——相当于考试背答案而非理解知识。Dropout、正则化、早停法是常用缓解手段。"}]}]};

let quiz = [];             // flattened question array (18 items)
let currentIndex = 0;
let timer = null;
let timeLeft = 15;
let isAnswered = false;
let correctCount = 0;
let dimensionResults = {}; // {dimName: {correct, total}}

const LABELS = ['A', 'B', 'C', 'D'];

// ─── Utility ──────────────────────────────────────────────────────────
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function pickRandom(arr, n) {
  const copy = [...arr];
  shuffle(copy);
  return copy.slice(0, n);
}

// ─── Init (data is already embedded in QUIZ_DATA) ────────────────────
function init() {
  const tagsContainer = document.getElementById('dimensionTags');
  tagsContainer.innerHTML = QUIZ_DATA.dimensions.map(d =>
    `<span class="dimension-tag">${d.emoji} ${d.name}</span>`
  ).join('');
}

// ─── Build quiz: pick 3 random per dimension ────────────────────────
function buildQuiz() {
  quiz = [];
  dimensionResults = {};
  for (const dim of QUIZ_DATA.dimensions) {
    const picked = pickRandom(dim.questions, 3);
    for (const q of picked) {
      quiz.push({ ...q, dimensionName: dim.name, dimensionEmoji: dim.emoji });
    }
    dimensionResults[dim.name] = { correct: 0, total: 3, emoji: dim.emoji };
  }
  shuffle(quiz);
}

// ─── Start ────────────────────────────────────────────────────────────
function startQuiz() {
  correctCount = 0;
  currentIndex = 0;
  buildQuiz();
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('resultScreen').classList.add('hidden');
  document.getElementById('quizScreen').classList.remove('hidden');
  showQuestion();
}

function restartQuiz() {
  document.getElementById('resultScreen').classList.add('hidden');
  document.getElementById('startScreen').classList.remove('hidden');
}

// ─── Show question ────────────────────────────────────────────────────
function showQuestion() {
  if (currentIndex >= quiz.length) {
    showResult();
    return;
  }

  isAnswered = false;
  timeLeft = 15;
  document.getElementById('explanationOverlay').classList.remove('active');

  const q = quiz[currentIndex];
  document.getElementById('dimensionBadge').textContent =
    `${q.dimensionEmoji} ${q.dimensionName}`;
  document.getElementById('progressText').textContent =
    `${currentIndex + 1} / ${quiz.length}`;
  document.getElementById('questionText').textContent = q.question;

  const container = document.getElementById('optionsContainer');
  container.innerHTML = '';
  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.innerHTML = `<span class="label">${LABELS[i]}</span>${opt}`;
    btn.dataset.index = i;
    btn.addEventListener('click', () => handleAnswer(i));
    container.appendChild(btn);
  });

  // Reset timer
  const fill = document.getElementById('timerFill');
  fill.style.width = '100%';
  fill.classList.remove('warning');
  startTimer();
}

// ─── Timer ────────────────────────────────────────────────────────────
function startTimer() {
  clearInterval(timer);
  const fill = document.getElementById('timerFill');
  const startTime = Date.now();
  const duration = 15 * 1000;

  timer = setInterval(() => {
    const elapsed = Date.now() - startTime;
    const remaining = Math.max(0, duration - elapsed);
    const pct = (remaining / duration) * 100;
    fill.style.width = pct + '%';
    fill.classList.toggle('warning', pct < 35);

    if (remaining <= 0) {
      clearInterval(timer);
      if (!isAnswered) handleTimeout();
    }
  }, 50);
}

// ─── Handle timeout ───────────────────────────────────────────────────
function handleTimeout() {
  if (isAnswered) return;
  isAnswered = true;
  const q = quiz[currentIndex];
  const buttons = document.querySelectorAll('.option-btn');
  buttons.forEach((btn, i) => {
    btn.classList.add('disabled');
    if (i === q.answer) btn.classList.add('reveal-correct');
  });

  showExplanation(false, q);
  dimensionResults[q.dimensionName].correct += 0;
  advanceAfterDelay();
}

// ─── Handle answer ────────────────────────────────────────────────────
function handleAnswer(selected) {
  if (isAnswered) return;
  isAnswered = true;
  clearInterval(timer);

  const q = quiz[currentIndex];
  const buttons = document.querySelectorAll('.option-btn');
  const isCorrect = selected === q.answer;

  buttons.forEach((btn, i) => {
    btn.classList.add('disabled');
    if (i === q.answer) btn.classList.add('correct');
    else if (i === selected && !isCorrect) btn.classList.add('wrong');
  });

  if (isCorrect) {
    correctCount++;
    dimensionResults[q.dimensionName].correct++;
  }

  showExplanation(isCorrect, q);
  advanceAfterDelay();
}

// ─── Explanation overlay ──────────────────────────────────────────────
function showExplanation(isCorrect, q) {
  const overlay = document.getElementById('explanationOverlay');
  const icon = document.getElementById('explanationIcon');
  const title = document.getElementById('explanationTitle');
  const text = document.getElementById('explanationText');

  if (isCorrect) {
    icon.textContent = '✅';
    title.textContent = '✓ 回答正确！';
    title.className = 'explanation-title correct-title';
  } else {
    icon.textContent = '💡';
    title.textContent = '✗ 回答错误';
    title.className = 'explanation-title wrong-title';
  }

  // Highlight correct answer in explanation
  const answerLetter = LABELS[q.answer];
  const answerText = q.options[q.answer];
  text.textContent = `正确答案：${answerLetter}. ${answerText}`;

  // Show explanation text below
  setTimeout(() => {
    text.textContent = `💡 ${q.explanation}`;
  }, 100);

  overlay.classList.add('active');
}

function advanceAfterDelay() {
  setTimeout(() => {
    currentIndex++;
    showQuestion();
  }, 1800);
}

// ─── Results ──────────────────────────────────────────────────────────
function showResult() {
  document.getElementById('quizScreen').classList.add('hidden');
  document.getElementById('resultScreen').classList.remove('hidden');

  document.getElementById('finalScore').textContent = `${correctCount}/${quiz.length}`;
  const pct = Math.round((correctCount / quiz.length) * 100);
  document.getElementById('scorePercent').textContent = `正确率 ${pct}%`;

  const container = document.getElementById('resultDetails');
  container.innerHTML = '';
  for (const [name, data] of Object.entries(dimensionResults)) {
    const div = document.createElement('div');
    div.className = 'result-dim-item';
    div.innerHTML = `
      <span class="dim-name">${data.emoji} ${name}</span>
      <span class="dim-score">${data.correct} / ${data.total}</span>
    `;
    container.appendChild(div);
  }
}

// ─── Init on page load ───────────────────────────────────────────────
init();
</script>
